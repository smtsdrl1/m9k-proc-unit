<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ice Tower</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    background: #0a0a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: rgba(0,0,30,0.85);
    z-index: 10;
    color: #7ff;
    font-size: 15px;
    font-weight: bold;
  }
  #canvas {
    display: block;
    background: #08082a;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,30,0.93);
    z-index: 20;
    color: #fff;
    text-align: center;
    gap: 18px;
  }
  #overlay h1 {
    font-size: 2.8em;
    color: #7ff;
    text-shadow: 0 0 20px #0ff, 0 0 40px #07f;
    letter-spacing: 4px;
  }
  #overlay p { font-size: 1em; color: #adf; max-width: 280px; line-height: 1.6; }
  #overlay .score-display { font-size: 1.5em; color: #ff7; }
  #startBtn {
    margin-top: 10px;
    padding: 16px 48px;
    background: linear-gradient(135deg, #0af, #07f);
    color: #fff;
    font-size: 1.3em;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 24px #0af;
  }
  #startBtn:active { transform: scale(0.96); }
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px 16px 20px;
    z-index: 10;
    pointer-events: none;
  }
  .ctrl-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid rgba(120,220,255,0.5);
    background: rgba(0,150,255,0.2);
    color: #7ff;
    font-size: 2em;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .ctrl-btn:active { background: rgba(0,200,255,0.4); border-color: #0ff; }
  #jumpBtn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid rgba(255,200,100,0.6);
    background: rgba(255,150,0,0.2);
    color: #ffa;
    font-size: 1.8em;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  #jumpBtn:active { background: rgba(255,200,0,0.4); border-color: #ff0; }
</style>
</head>
<body>

<div id="ui">
  <span>SKOR: <span id="scoreEl">0</span></span>
  <span>❄️ ICE TOWER</span>
  <span>EN İYİ: <span id="bestEl">0</span></span>
</div>

<canvas id="canvas"></canvas>

<div id="controls">
  <div class="ctrl-btn" id="leftBtn">◀</div>
  <div style="width:100px"></div>
  <div class="ctrl-btn" id="rightBtn">▶</div>
</div>
<div id="jumpBtn">↑</div>

<div id="overlay">
  <h1>❄️ ICE<br>TOWER</h1>
  <p>Platformlara zıpla, aşağı in!<br>Ne kadar derine inebilirsin?</p>
  <div class="score-display" id="finalScore"></div>
  <button id="startBtn">BAŞLA</button>
  <p style="font-size:0.85em; color:#68a; margin-top:-8px;">
    ◀ ▶ hareket &nbsp;|&nbsp; ↑ zıpla<br>
    Dokunmatik kontroller aktif
  </p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreEl');
const bestEl = document.getElementById('bestEl');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const jumpBtn = document.getElementById('jumpBtn');

// ---- Responsive canvas ----
function resize() {
  canvas.width = Math.min(window.innerWidth, 480);
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- Game constants ----
const GRAVITY = 0.45;
const JUMP_FORCE = -11;
const MOVE_SPEED = 4.2;
const ICE_FRICTION = 0.88;
const PLATFORM_GAP = 95;
const PLATFORM_H = 14;
const PLAYER_W = 28;
const PLAYER_H = 36;
const SCROLL_SPEED_BASE = 1.2;

// ---- State ----
let state = 'menu';
let score = 0;
let best = parseInt(localStorage.getItem('iceTowerBest') || '0');
let cameraY = 0;
let platforms = [];
let particles = [];
let player;
let keys = { left: false, right: false, up: false };
let upPressed = false;
let frameCount = 0;
let danger = 0; // freeze bar from top
let dangerSpeed = 0.3;
let dangerY = -200; // screen Y of freeze wall

bestEl.textContent = best;

// ---- Particle system ----
function spawnParticles(x, y, color, n=6) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*4,
      vy: (Math.random()-2)*3,
      life: 1,
      decay: 0.04+Math.random()*0.04,
      r: 2+Math.random()*3,
      color
    });
  }
}

// ---- Platform generation ----
function generatePlatforms(fromY, toY) {
  let y = fromY;
  while (y > toY) {
    const w = 60 + Math.random() * 90;
    const x = Math.random() * (canvas.width - w);
    const type = Math.random() < 0.12 ? 'bounce' : Math.random() < 0.1 ? 'crumble' : 'normal';
    platforms.push({ x, y, w, h: PLATFORM_H, type, crumbled: false, crumbleTimer: 0 });
    y -= PLATFORM_GAP + Math.random() * 40;
  }
}

// ---- Init game ----
function initGame() {
  score = 0;
  frameCount = 0;
  cameraY = 0;
  dangerY = -200;
  danger = 0;
  platforms = [];
  particles = [];

  // Starting platform
  platforms.push({
    x: canvas.width/2 - 70,
    y: canvas.height * 0.4,
    w: 140,
    h: PLATFORM_H,
    type: 'normal',
    crumbled: false,
    crumbleTimer: 0
  });

  generatePlatforms(canvas.height * 0.4 - PLATFORM_GAP, -10000);

  player = {
    x: canvas.width/2 - PLAYER_W/2,
    y: canvas.height * 0.4 - PLAYER_H - 2,
    vx: 0,
    vy: 0,
    onGround: false,
    coyoteTime: 0,
    jumpBuffer: 0,
    dir: 1,
    frame: 0,
    frameTimer: 0,
    deathAnim: 0
  };
}

// ---- Controls ----
// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && state === 'playing') {
    player.jumpBuffer = 10;
  }
  if (e.key === 'Enter' && state === 'menu') startGame();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// Touch buttons
function holdStart(key) { keys[key] = true; }
function holdEnd(key) { keys[key] = false; }

leftBtn.addEventListener('touchstart', e => { e.preventDefault(); holdStart('left'); }, {passive:false});
leftBtn.addEventListener('touchend', e => { e.preventDefault(); holdEnd('left'); }, {passive:false});
leftBtn.addEventListener('mousedown', () => holdStart('left'));
leftBtn.addEventListener('mouseup', () => holdEnd('left'));

rightBtn.addEventListener('touchstart', e => { e.preventDefault(); holdStart('right'); }, {passive:false});
rightBtn.addEventListener('touchend', e => { e.preventDefault(); holdEnd('right'); }, {passive:false});
rightBtn.addEventListener('mousedown', () => holdStart('right'));
rightBtn.addEventListener('mouseup', () => holdEnd('right'));

jumpBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'playing') player.jumpBuffer = 10;
}, {passive:false});
jumpBtn.addEventListener('mousedown', () => {
  if (state === 'playing') player.jumpBuffer = 10;
});

// Swipe jump
let touchStartY = 0;
canvas.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (dy > 30 && state === 'playing') player.jumpBuffer = 10;
}, {passive:true});

startBtn.addEventListener('click', startGame);

function startGame() {
  initGame();
  state = 'playing';
  overlay.style.display = 'none';
}

// ---- Physics & update ----
function update() {
  if (state !== 'playing') return;
  frameCount++;

  // Horizontal movement
  if (keys.left) {
    player.vx -= 1.2;
    player.dir = -1;
  }
  if (keys.right) {
    player.vx += 1.2;
    player.dir = 1;
  }
  player.vx *= ICE_FRICTION;
  player.vx = Math.max(-MOVE_SPEED*1.5, Math.min(MOVE_SPEED*1.5, player.vx));

  // Wrap around
  if (player.x + PLAYER_W < 0) player.x = canvas.width;
  if (player.x > canvas.width) player.x = -PLAYER_W;

  // Gravity
  player.vy += GRAVITY;
  player.vy = Math.min(player.vy, 18);

  // Coyote time
  if (player.onGround) player.coyoteTime = 8;
  else if (player.coyoteTime > 0) player.coyoteTime--;

  // Jump buffer
  if (player.jumpBuffer > 0) player.jumpBuffer--;

  // Jump
  if (player.jumpBuffer > 0 && (player.onGround || player.coyoteTime > 0)) {
    player.vy = JUMP_FORCE;
    player.coyoteTime = 0;
    player.jumpBuffer = 0;
    spawnParticles(player.x + PLAYER_W/2, player.y + PLAYER_H, '#7ff', 8);
  }

  player.onGround = false;

  // Move Y
  player.y += player.vy;
  player.x += player.vx;

  // Camera: keep player in upper 40%
  const screenY = player.y - cameraY;
  const targetCameraY = player.y - canvas.height * 0.38;
  if (targetCameraY < cameraY) {
    cameraY = targetCameraY;
  }
  // Camera also auto-descends (ice melts from top)
  const autoScroll = SCROLL_SPEED_BASE + frameCount * 0.0008;
  cameraY -= autoScroll;

  // Danger freeze wall
  dangerY = cameraY - 60;

  // Score = how far down (negative world Y)
  score = Math.max(score, Math.floor((-player.y + canvas.height * 0.4) / 10));
  scoreEl.textContent = score;

  // Generate more platforms below
  const lowestPlatY = Math.min(...platforms.map(p => p.y));
  if (lowestPlatY > cameraY - canvas.height * 2) {
    generatePlatforms(lowestPlatY - PLATFORM_GAP, cameraY - canvas.height * 3);
  }

  // Remove off-screen platforms
  platforms = platforms.filter(p => p.y < cameraY + canvas.height + 100);

  // Platform collisions (only when falling)
  if (player.vy >= 0) {
    for (const plat of platforms) {
      if (plat.crumbled) continue;
      const px = player.x, py = player.y;
      const prevBottom = py - player.vy + PLAYER_H;
      const bottom = py + PLAYER_H;
      if (
        px + PLAYER_W > plat.x + 4 &&
        px < plat.x + plat.w - 4 &&
        prevBottom <= plat.y + 2 &&
        bottom >= plat.y
      ) {
        player.y = plat.y - PLAYER_H;
        player.vy = 0;
        player.onGround = true;

        if (plat.type === 'bounce') {
          player.vy = JUMP_FORCE * 1.3;
          spawnParticles(player.x + PLAYER_W/2, plat.y, '#fa0', 10);
        } else if (plat.type === 'crumble') {
          plat.crumbleTimer++;
          if (plat.crumbleTimer > 20) {
            plat.crumbled = true;
            spawnParticles(plat.x + plat.w/2, plat.y, '#f44', 12);
          }
        } else {
          spawnParticles(player.x + PLAYER_W/2, plat.y + 2, '#aef', 3);
        }
      }
    }
  }

  // Death: fell off bottom or hit freeze wall
  const playerScreenY = player.y - cameraY;
  if (playerScreenY > canvas.height + 50 || playerScreenY < dangerY - cameraY - 20) {
    triggerDeath();
  }

  // Animate player frame
  if (player.vx !== 0) {
    player.frameTimer++;
    if (player.frameTimer > 6) { player.frame = (player.frame+1)%4; player.frameTimer = 0; }
  }

  // Update particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function triggerDeath() {
  state = 'dead';
  if (score > best) {
    best = score;
    localStorage.setItem('iceTowerBest', best);
    bestEl.textContent = best;
    finalScore.textContent = '🏆 YENİ REKOR: ' + score;
  } else {
    finalScore.textContent = 'SKOR: ' + score + '  |  EN İYİ: ' + best;
  }
  startBtn.textContent = 'TEKRAR';
  overlay.style.display = 'flex';
  state = 'menu';
}

// ---- Draw ----
function drawPlayer() {
  const sx = player.x - 0;
  const sy = player.y - cameraY;

  ctx.save();
  ctx.translate(sx + PLAYER_W/2, sy + PLAYER_H/2);
  if (player.dir < 0) ctx.scale(-1, 1);

  // Body
  ctx.fillStyle = '#3af';
  ctx.beginPath();
  ctx.roundRect(-PLAYER_W/2+2, -PLAYER_H/2+8, PLAYER_W-4, PLAYER_H-10, 4);
  ctx.fill();

  // Head
  ctx.fillStyle = '#fdd';
  ctx.beginPath();
  ctx.ellipse(0, -PLAYER_H/2+4, 10, 11, 0, 0, Math.PI*2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(3, -PLAYER_H/2+1, 3, 3);

  // Hat
  ctx.fillStyle = '#07f';
  ctx.fillRect(-8, -PLAYER_H/2-6, 16, 6);
  ctx.fillRect(-5, -PLAYER_H/2-12, 10, 8);

  // Scarf
  ctx.fillStyle = '#f44';
  ctx.fillRect(-PLAYER_W/2+2, -PLAYER_H/2+19, PLAYER_W-4, 5);

  // Legs (animated)
  const legOff = Math.sin(player.frame * Math.PI/2) * 5;
  ctx.fillStyle = '#08d';
  ctx.fillRect(-8, PLAYER_H/2-10, 7, 10 + legOff);
  ctx.fillRect(1, PLAYER_H/2-10, 7, 10 - legOff);

  // Ice skates
  ctx.fillStyle = '#aef';
  ctx.fillRect(-10, PLAYER_H/2-2+legOff, 9, 4);
  ctx.fillRect(1, PLAYER_H/2-2-legOff, 9, 4);

  ctx.restore();
}

function drawPlatform(p) {
  const sy = p.y - cameraY;
  if (sy > canvas.height + 20 || sy < -30) return;

  ctx.save();

  if (p.type === 'bounce') {
    // Orange bouncy platform
    const grad = ctx.createLinearGradient(p.x, sy-p.h, p.x, sy+p.h);
    grad.addColorStop(0, '#ffa040');
    grad.addColorStop(1, '#c05000');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(p.x, sy - p.h/2, p.w, p.h, 4);
    ctx.fill();
    ctx.strokeStyle = '#ffcc44';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Spring icon
    ctx.fillStyle = '#ffe';
    ctx.font = '10px sans-serif';
    ctx.fillText('↑↑', p.x + p.w/2 - 8, sy - p.h/2 - 2);
  } else if (p.type === 'crumble') {
    // Red crumble platform
    const crack = p.crumbleTimer / 20;
    ctx.globalAlpha = 1 - crack * 0.7;
    const grad = ctx.createLinearGradient(p.x, sy-p.h, p.x, sy+p.h);
    grad.addColorStop(0, '#ff6060');
    grad.addColorStop(1, '#900');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(p.x, sy - p.h/2, p.w, p.h, 3);
    ctx.fill();
    if (crack > 0.3) {
      ctx.strokeStyle = '#f00';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x + p.w*0.3, sy - p.h/2);
      ctx.lineTo(p.x + p.w*0.5, sy + p.h/2);
      ctx.moveTo(p.x + p.w*0.6, sy - p.h/2);
      ctx.lineTo(p.x + p.w*0.45, sy + p.h/2);
      ctx.stroke();
    }
  } else {
    // Ice platform
    const grad = ctx.createLinearGradient(p.x, sy-p.h, p.x, sy+p.h*2);
    grad.addColorStop(0, '#b8f0ff');
    grad.addColorStop(0.4, '#60c8f0');
    grad.addColorStop(1, '#2080c0');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(p.x, sy - p.h/2, p.w, p.h, 5);
    ctx.fill();

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.roundRect(p.x+4, sy - p.h/2 + 2, p.w-8, p.h/2-1, 3);
    ctx.fill();

    // Ice crystals
    ctx.strokeStyle = 'rgba(200,240,255,0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const cx = p.x + p.w*(0.2+i*0.3);
      const cy = sy - p.h/2 + 1;
      ctx.beginPath();
      ctx.moveTo(cx, cy); ctx.lineTo(cx, cy-5);
      ctx.moveTo(cx-3, cy-2); ctx.lineTo(cx+3, cy-2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawBackground() {
  // Gradient background
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#050518');
  grad.addColorStop(1, '#0a1535');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars (fixed to screen)
  ctx.fillStyle = 'rgba(200,220,255,0.6)';
  const starSeed = Math.floor(cameraY / 200);
  for (let i = 0; i < 40; i++) {
    const s = Math.sin(i*7.3 + starSeed) * 0.5 + 0.5;
    const sx = ((i * 137.5) % canvas.width);
    const sy = ((i * 97.3 + (cameraY * 0.05)) % canvas.height + canvas.height) % canvas.height;
    ctx.fillRect(sx, sy, s*2+0.5, s*2+0.5);
  }

  // Tower walls
  ctx.strokeStyle = 'rgba(100,180,255,0.12)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 16]);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, canvas.height);
  ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Brick pattern on sides
  ctx.strokeStyle = 'rgba(80,140,200,0.08)';
  ctx.lineWidth = 1;
  const brickH = 30;
  const brickW = 20;
  const camOffset = ((-cameraY) % brickH + brickH) % brickH;
  for (let row = -1; row < canvas.height/brickH + 2; row++) {
    const y = row * brickH + camOffset;
    const offset = (row % 2) * brickW * 0.5;
    for (let col = 0; col < 3; col++) {
      ctx.strokeRect(col*brickW + offset - brickW, y, brickW, brickH);
      ctx.strokeRect(canvas.width - col*brickW - offset, y, brickW, brickH);
    }
  }
}

function drawFreezeWall() {
  // Freeze wall at top
  const wallY = dangerY - cameraY;
  const grad = ctx.createLinearGradient(0, wallY - 40, 0, wallY + 20);
  grad.addColorStop(0, 'rgba(0,200,255,0)');
  grad.addColorStop(0.5, 'rgba(0,180,255,0.35)');
  grad.addColorStop(1, 'rgba(0,240,255,0.75)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, wallY - 40, canvas.width, 60);

  // Icicles
  ctx.fillStyle = '#7ef';
  for (let i = 0; i < 12; i++) {
    const ix = (i / 11) * canvas.width;
    const ih = 10 + Math.sin(Date.now()*0.003 + i) * 8 + i*2;
    ctx.beginPath();
    ctx.moveTo(ix - 6, wallY + 2);
    ctx.lineTo(ix + 6, wallY + 2);
    ctx.lineTo(ix, wallY + ih);
    ctx.closePath();
    ctx.fill();
  }

  // Danger text
  if (Math.floor(Date.now() / 300) % 2 === 0) {
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('⚠ DONMA YAKLAŞIYOR', canvas.width/2, wallY + 35);
    ctx.textAlign = 'left';
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - cameraY, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Danger proximity indicator
  const playerScreenY = player.y - cameraY;
  const wallScreenY = dangerY - cameraY;
  const dist = playerScreenY - wallScreenY;
  if (dist < 200) {
    const alpha = 1 - dist/200;
    ctx.fillStyle = `rgba(0,200,255,${alpha * 0.15})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

// ---- Game loop ----
function loop() {
  update();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  for (const p of platforms) drawPlatform(p);
  drawParticles();
  if (state === 'playing') {
    drawPlayer();
    drawFreezeWall();
    drawHUD();
  }
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
