<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ice Tower</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    background: #0a0a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #ui {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: rgba(0,0,30,0.85);
    z-index: 10;
    color: #7ff;
    font-size: 15px;
    font-weight: bold;
  }
  #canvas {
    display: block;
    background: #08082a;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,30,0.93);
    z-index: 20;
    color: #fff;
    text-align: center;
    gap: 18px;
  }
  #overlay h1 {
    font-size: 2.8em;
    color: #7ff;
    text-shadow: 0 0 20px #0ff, 0 0 40px #07f;
    letter-spacing: 4px;
  }
  #overlay p { font-size: 1em; color: #adf; max-width: 280px; line-height: 1.6; }
  #overlay .score-display { font-size: 1.5em; color: #ff7; }
  #startBtn {
    margin-top: 10px;
    padding: 16px 48px;
    background: linear-gradient(135deg, #0af, #07f);
    color: #fff;
    font-size: 1.3em;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 24px #0af;
  }
  #startBtn:active { transform: scale(0.96); }
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px 16px 20px;
    z-index: 10;
    pointer-events: none;
  }
  .ctrl-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid rgba(120,220,255,0.5);
    background: rgba(0,150,255,0.2);
    color: #7ff;
    font-size: 2em;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .ctrl-btn:active { background: rgba(0,200,255,0.4); border-color: #0ff; }
  #jumpBtn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid rgba(255,200,100,0.6);
    background: rgba(255,150,0,0.2);
    color: #ffa;
    font-size: 1.8em;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  #jumpBtn:active { background: rgba(255,200,0,0.4); border-color: #ff0; }
</style>
</head>
<body>

<div id="ui">
  <span>SKOR: <span id="scoreEl">0</span></span>
  <span>ICE TOWER</span>
  <span>EN IYI: <span id="bestEl">0</span></span>
</div>

<canvas id="canvas"></canvas>

<div id="controls">
  <div class="ctrl-btn" id="leftBtn">&#9664;</div>
  <div style="width:100px"></div>
  <div class="ctrl-btn" id="rightBtn">&#9654;</div>
</div>
<div id="jumpBtn">&#8593;</div>

<div id="overlay">
  <h1>ICE<br>TOWER</h1>
  <p>Platformlara zipla, asagi in!<br>Ne kadar derine inebilirsin?<br><br>Duvara yapisip duvardan zipla!</p>
  <div class="score-display" id="finalScore"></div>
  <button id="startBtn">BASLA</button>
  <p style="font-size:0.85em; color:#68a; margin-top:-8px;">
    &#9664; &#9654; hareket &nbsp;|&nbsp; &#8593; zipla<br>
    Dokunmatik kontroller aktif
  </p>
</div>

<script>
// =============================================================================
// ICE TOWER — Complete Physics & Mechanics System
// =============================================================================

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const overlay    = document.getElementById('overlay');
const scoreEl    = document.getElementById('scoreEl');
const bestEl     = document.getElementById('bestEl');
const finalScore = document.getElementById('finalScore');
const startBtn   = document.getElementById('startBtn');
const leftBtn    = document.getElementById('leftBtn');
const rightBtn   = document.getElementById('rightBtn');
const jumpBtn    = document.getElementById('jumpBtn');

// ---------------------------------------------------------------------------
// RESPONSIVE CANVAS
// ---------------------------------------------------------------------------
function resize() {
  canvas.width  = Math.min(window.innerWidth, 480);
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// PHYSICS CONSTANTS  (all values in px/frame at 60 fps)
// ---------------------------------------------------------------------------
const GRAVITY           = 0.45;   // px/frame² downward acceleration
const JUMP_FORCE        = -11.0;  // initial vy on normal jump (negative = up)
const JUMP_CUT_FACTOR   = 0.5;    // multiply vy by this when jump released early
const MAX_FALL_SPEED    = 18;     // terminal velocity cap, px/frame
const MAX_RUN_SPEED     = 6.0;    // horizontal speed cap, px/frame
const RUN_ACCEL         = 1.2;    // horizontal acceleration per frame
const GROUND_FRICTION   = 0.82;   // high friction on ice platforms (slippery but not frictionless)
const AIR_FRICTION      = 0.95;   // low friction mid-air (preserve momentum)

// Wall mechanics
const WALL_SLIDE_MAX_VY = 2.0;    // max fall speed when hugging a wall
const WALL_JUMP_SPEED   = 9.0;    // wall-jump launch magnitude
// 60° from vertical → cos(60°)=0.5 → vx component, sin(60°)≈0.866 → vy component
// We push away from wall (opposite x) and upward (negative y)
const WALL_JUMP_VX      = WALL_JUMP_SPEED * 0.5;    // ≈ 4.5 px/frame horizontal
const WALL_JUMP_VY      = -(WALL_JUMP_SPEED * 0.866); // ≈ -7.79 px/frame vertical
const WALL_JUMP_GRACE   = 6;      // frames after leaving wall that wall-jump still fires (≈0.1s@60fps)

// Timing
const COYOTE_FRAMES     = 8;      // frames after leaving platform edge where jump still works
const JUMP_BUFFER_MAX   = 10;     // frames ahead that a jump press is remembered

// Dimensions
const PLAYER_W = 28;
const PLAYER_H = 36;
const PLATFORM_H = 14;

// Difficulty / camera
const SCROLL_SPEED_BASE = 1.2;   // camera auto-scroll base speed (px/frame)
const PLATFORM_GAP_START = 90;   // initial vertical gap between platforms (px)
const PLATFORM_GAP_MAX   = 140;  // maximum vertical gap after score 500
const SCORE_GAP_THRESHOLD = 500; // score at which max gap is reached

// ---------------------------------------------------------------------------
// GAME STATE
// ---------------------------------------------------------------------------
let state      = 'menu';
let score      = 0;
let best       = parseInt(localStorage.getItem('iceTowerBest') || '0');
let cameraY    = 0;      // world-Y of the top of the viewport
let platforms  = [];
let particles  = [];
let player;
let keys       = { left: false, right: false, up: false };
let jumpHeld   = false;  // track whether jump button is currently held
let frameCount = 0;
let dangerY    = -200;   // world-Y of the freeze wall

bestEl.textContent = best;

// ---------------------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------------------
function lerp(a, b, t) { return a + (b - a) * t; }

// ---------------------------------------------------------------------------
// PARTICLE SYSTEM
// ---------------------------------------------------------------------------
function spawnParticles(x, y, color, n = 6) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 2) * 3,
      life: 1,
      decay: 0.04 + Math.random() * 0.04,
      r: 2 + Math.random() * 3,
      color
    });
  }
}

// ---------------------------------------------------------------------------
// PLATFORM GENERATION
//   gap grows linearly from PLATFORM_GAP_START to PLATFORM_GAP_MAX
//   as score increases from 0 to SCORE_GAP_THRESHOLD.
// ---------------------------------------------------------------------------
function currentGap() {
  const t = Math.min(score / SCORE_GAP_THRESHOLD, 1);
  return lerp(PLATFORM_GAP_START, PLATFORM_GAP_MAX, t);
}

function generatePlatforms(fromY, toY) {
  let y = fromY;
  while (y > toY) {
    const w    = 60 + Math.random() * 90;
    const x    = Math.random() * (canvas.width - w);
    const type = Math.random() < 0.12 ? 'bounce'
               : Math.random() < 0.10 ? 'crumble'
               : 'normal';
    platforms.push({ x, y, w, h: PLATFORM_H, type, crumbled: false, crumbleTimer: 0 });
    y -= currentGap() + Math.random() * 40;
  }
}

// ---------------------------------------------------------------------------
// PLAYER INITIALISATION
// ---------------------------------------------------------------------------
function initGame() {
  score      = 0;
  frameCount = 0;
  cameraY    = 0;
  dangerY    = -200;
  platforms  = [];
  particles  = [];

  // Starting platform (wide, centred, in upper third of screen)
  platforms.push({
    x: canvas.width / 2 - 70,
    y: canvas.height * 0.4,
    w: 140,
    h: PLATFORM_H,
    type: 'normal',
    crumbled: false,
    crumbleTimer: 0
  });

  generatePlatforms(canvas.height * 0.4 - PLATFORM_GAP_START, -10000);

  player = {
    x:  canvas.width / 2 - PLAYER_W / 2,
    y:  canvas.height * 0.4 - PLAYER_H - 2,
    vx: 0,
    vy: 0,

    // Ground state
    onGround:   false,
    coyoteTime: 0,       // frames remaining for coyote-time jump

    // Jump buffering / variable height
    jumpBuffer:  0,      // frames remaining for pre-jump buffer
    jumpHeld:    false,  // true while jump button held this jump
    jumpActive:  false,  // true from jump start until vy stops being negative

    // Wall state
    onWallLeft:   false, // touching left wall this frame
    onWallRight:  false, // touching right wall this frame
    wallGrace:    0,     // frames remaining after leaving wall for wall-jump

    // Visual
    dir:        1,
    frame:      0,
    frameTimer: 0
  };
}

// ---------------------------------------------------------------------------
// 1. COLLISION DETECTION — AABB SWEPT COLLISION (anti-tunnel)
//    We sub-step movement by splitting each axis into segments of at most
//    8 px so that fast-moving players cannot skip through thin platforms.
// ---------------------------------------------------------------------------
const SUB_STEP_SIZE = 8; // px — max distance per sub-step

/**
 * Resolve one axis of player movement against all platforms.
 * axis: 'x' | 'y'
 * Returns { landed, hitLeft, hitRight, hitCeiling }
 */
function sweepAxis(axis, delta) {
  let result = { landed: false, hitLeft: false, hitRight: false, hitCeiling: false };

  const steps    = Math.max(1, Math.ceil(Math.abs(delta) / SUB_STEP_SIZE));
  const stepSize = delta / steps;

  for (let s = 0; s < steps; s++) {
    if (axis === 'x') player.x += stepSize;
    else              player.y += stepSize;

    for (const plat of platforms) {
      if (plat.crumbled) continue;

      // Broad AABB overlap test
      const overlapX = player.x < plat.x + plat.w && player.x + PLAYER_W > plat.x;
      const overlapY = player.y < plat.y + plat.h && player.y + PLAYER_H > plat.y;
      if (!overlapX || !overlapY) continue;

      if (axis === 'y') {
        const penetrationDown = (player.y + PLAYER_H) - plat.y;
        const penetrationUp   = (plat.y + plat.h) - player.y;

        if (penetrationDown <= penetrationUp && stepSize >= 0) {
          // Landing on top of platform
          player.y = plat.y - PLAYER_H;
          result.landed = true;
          player.vy = 0;

          // Platform special effects
          if (plat.type === 'bounce') {
            player.vy = JUMP_FORCE * 1.3;
            spawnParticles(player.x + PLAYER_W / 2, plat.y, '#fa0', 10);
          } else if (plat.type === 'crumble') {
            plat.crumbleTimer++;
            if (plat.crumbleTimer > 20) {
              plat.crumbled = true;
              spawnParticles(plat.x + plat.w / 2, plat.y, '#f44', 12);
            }
          } else {
            spawnParticles(player.x + PLAYER_W / 2, plat.y + 2, '#aef', 2);
          }
        } else if (penetrationUp < penetrationDown && stepSize < 0) {
          // Hitting ceiling
          player.y = plat.y + plat.h;
          result.hitCeiling = true;
          if (player.vy < 0) player.vy = 0;
        }

      } else { // axis === 'x'
        const penetrationRight = (player.x + PLAYER_W) - plat.x;
        const penetrationLeft  = (plat.x + plat.w) - player.x;

        if (penetrationRight <= penetrationLeft && stepSize > 0) {
          // Player moved right into platform left face
          player.x = plat.x - PLAYER_W;
          result.hitRight = true;
          player.vx = 0;
        } else if (penetrationLeft < penetrationRight && stepSize < 0) {
          // Player moved left into platform right face
          player.x = plat.x + plat.w;
          result.hitLeft = true;
          player.vx = 0;
        }
      }
    }
  }
  return result;
}

// ---------------------------------------------------------------------------
// 2. WALL COLLISION DETECTION (tower side walls)
//    Tower walls are the canvas left/right edges.
// ---------------------------------------------------------------------------
function resolveWallCollision() {
  player.onWallLeft  = false;
  player.onWallRight = false;

  if (player.x <= 0) {
    player.x = 0;
    if (player.vx < 0) player.vx = 0;
    player.onWallLeft = true;
  }
  if (player.x + PLAYER_W >= canvas.width) {
    player.x = canvas.width - PLAYER_W;
    if (player.vx > 0) player.vx = 0;
    player.onWallRight = true;
  }
}

// ---------------------------------------------------------------------------
// 3. WALL SLIDE
//    When player is pressed against a wall (onWallLeft/Right) and moving
//    toward it (or neutral) and is NOT on the ground, cap downward vy to
//    WALL_SLIDE_MAX_VY, creating a slow slide effect.
// ---------------------------------------------------------------------------
function applyWallSlide() {
  if (player.onGround) return;

  const slidingLeft  = player.onWallLeft  && (keys.left  || player.vx <= 0);
  const slidingRight = player.onWallRight && (keys.right || player.vx >= 0);

  if ((slidingLeft || slidingRight) && player.vy > WALL_SLIDE_MAX_VY) {
    player.vy = WALL_SLIDE_MAX_VY; // slow slide down the wall
    // Emit occasional ice-dust particles
    if (frameCount % 8 === 0) {
      const wx = slidingLeft ? 0 : canvas.width;
      spawnParticles(wx, player.y + PLAYER_H * 0.6, '#aef', 2);
    }
  }

  // Update wall-grace timer
  if (slidingLeft || slidingRight) {
    player.wallGrace = WALL_JUMP_GRACE;
    player.lastWallDir = slidingLeft ? -1 : 1; // -1 = was on left wall
  } else if (player.wallGrace > 0) {
    player.wallGrace--;
  }
}

// ---------------------------------------------------------------------------
// 4. WALL JUMP
//    When sliding on wall (or within grace period) + jump pressed:
//    launch at 60° from vertical, away from wall.
//
//    Math: magnitude = WALL_JUMP_SPEED = 9
//      angle = 60° from vertical
//      vx = ±WALL_JUMP_VX = ±(9 * sin60°) = ±(9 * 0.866) ≈ ±7.79  — AWAY from wall
//      vy =  -WALL_JUMP_VY = -(9 * cos60°) = -(9 * 0.5)   = -4.5   — UP
//
//    Wait — let us use 60° from HORIZONTAL (like the original Ice Tower feel):
//      vx = WALL_JUMP_SPEED * cos(60°) = 9 * 0.5   = 4.5  (away from wall)
//      vy = WALL_JUMP_SPEED * sin(60°) = 9 * 0.866 ≈ 7.79 (upward, negative)
//    This gives a steep diagonal that feels intentional and powerful.
// ---------------------------------------------------------------------------
function tryWallJump() {
  const onWall = player.onWallLeft || player.onWallRight || player.wallGrace > 0;
  if (!onWall || player.onGround) return false;

  // Direction to launch: opposite of the wall the player was/is on
  const wallDir = player.onWallLeft ? -1
                : player.onWallRight ? 1
                : player.lastWallDir; // use grace direction

  // Away from wall = opposite sign
  player.vx = -wallDir * WALL_JUMP_VX;  // WALL_JUMP_VX = 4.5
  player.vy = WALL_JUMP_VY;             // WALL_JUMP_VY = -7.79

  player.wallGrace  = 0;
  player.jumpActive = true;
  player.jumpHeld   = jumpHeld;

  spawnParticles(
    wallDir === -1 ? 0 : canvas.width,   // particle source at wall
    player.y + PLAYER_H * 0.5,
    '#0ff', 8
  );
  return true;
}

// ---------------------------------------------------------------------------
// 5. NORMAL JUMP  (with coyote time + jump buffer)
// ---------------------------------------------------------------------------
function tryNormalJump() {
  if (player.jumpBuffer <= 0) return false;
  if (!player.onGround && player.coyoteTime <= 0) return false;

  player.vy         = JUMP_FORCE;   // -11
  player.coyoteTime = 0;
  player.jumpBuffer = 0;
  player.jumpActive = true;
  player.jumpHeld   = jumpHeld;

  spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H, '#7ff', 8);
  return true;
}

// ---------------------------------------------------------------------------
// 6. VARIABLE JUMP HEIGHT
//    While vy is negative (ascending) AND jump button was released:
//    cut vy by JUMP_CUT_FACTOR (0.5), effectively halving the jump height.
//    This is applied once per jump when the button is released mid-air.
// ---------------------------------------------------------------------------
function applyVariableJump() {
  if (player.jumpActive && player.vy < 0) {
    if (!jumpHeld && player.jumpHeld) {
      // Button was released this frame while still ascending
      player.vy *= JUMP_CUT_FACTOR;
    }
  }
  player.jumpHeld = jumpHeld;

  // Jump is no longer "active" once player starts falling
  if (player.vy >= 0) player.jumpActive = false;
}

// ---------------------------------------------------------------------------
// 7. CAMERA SYSTEM
//    - Camera follows player downward only (never scrolls up to reveal sky).
//    - Auto-scrolls downward at increasing speed over time.
//    - Player dies if:
//        a) above camera top   → caught by freeze wall
//        b) below camera bottom → fell off screen
//    - Viewport shows ~2 screen-heights of world content ahead (below).
// ---------------------------------------------------------------------------
function updateCamera() {
  // Target: keep player in upper ~38% of the screen
  const targetCameraY = player.y - canvas.height * 0.38;

  // Camera only follows player DOWN (lower world-Y values = higher on screen)
  // cameraY is the world-Y at the top of the viewport.
  // Moving cameraY down means the viewport moves down → player appears to go up.
  // We DECREASE cameraY to scroll up (reveal higher world), INCREASE to scroll down.
  // Following player DOWN = cameraY should track when player is going further down.
  if (targetCameraY < cameraY) {
    // Player is higher than our target band — chase them up
    cameraY = targetCameraY;
  }

  // Auto-scroll: difficulty ramp  (§8 formula)
  // baseSpeed + (frameCount * 0.001) so at frame 3000 (50 s) speed = 1.2 + 3 = 4.2
  const autoScroll = SCROLL_SPEED_BASE + frameCount * 0.001;
  cameraY -= autoScroll; // move viewport downward in world coords

  // Freeze wall position: just above camera top
  dangerY = cameraY - 60; // world-Y — 60 px above the top of the viewport
}

function checkDeathBounds() {
  const playerScreenY = player.y - cameraY;
  // Above camera top (freeze wall got them)
  if (player.y < dangerY + PLAYER_H) return true;
  // Below camera bottom (fell through)
  if (playerScreenY > canvas.height + 80) return true;
  return false;
}

// ---------------------------------------------------------------------------
// MAIN UPDATE LOOP
// ---------------------------------------------------------------------------
function update() {
  if (state !== 'playing') return;
  frameCount++;

  // ---- Horizontal input ----
  if (keys.left) {
    player.vx -= RUN_ACCEL;
    player.dir = -1;
  }
  if (keys.right) {
    player.vx += RUN_ACCEL;
    player.dir = 1;
  }

  // ---- Ice friction (ground vs air) ----
  const friction = player.onGround ? GROUND_FRICTION : AIR_FRICTION;
  player.vx *= friction;

  // Clamp horizontal speed to MAX_RUN_SPEED
  player.vx = Math.max(-MAX_RUN_SPEED, Math.min(MAX_RUN_SPEED, player.vx));

  // ---- Gravity ----
  player.vy += GRAVITY;
  player.vy  = Math.min(player.vy, MAX_FALL_SPEED);

  // ---- Wall slide (applied before movement resolves) ----
  // (runs after previous frame's wall flags are known)
  applyWallSlide();

  // ---- Variable jump height ----
  applyVariableJump();

  // ---- Coyote time countdown ----
  if (player.onGround) {
    player.coyoteTime = COYOTE_FRAMES;
  } else if (player.coyoteTime > 0) {
    player.coyoteTime--;
  }

  // ---- Jump buffer countdown ----
  if (player.jumpBuffer > 0) player.jumpBuffer--;

  // ---- Jump resolution (wall jump takes priority) ----
  if (player.jumpBuffer > 0) {
    const didWallJump = tryWallJump();
    if (!didWallJump) tryNormalJump();
  }

  // ---- Reset ground flag before collision ----
  player.onGround = false;

  // ---- Swept AABB platform collision — X axis first, then Y ----
  // Resolving X first prevents corner-catching on vertical surfaces.
  const collX = sweepAxis('x', player.vx);
  const collY = sweepAxis('y', player.vy);

  if (collY.landed) player.onGround = true;
  if (collY.hitCeiling && player.vy < 0) player.vy = 0;

  // ---- Tower wall collision + wall slide flags ----
  resolveWallCollision();

  // ---- Camera + danger wall ----
  updateCamera();

  // ---- Score = depth below starting position (each 10 px world-Y = 1 point) ----
  score = Math.max(score, Math.floor((-player.y + canvas.height * 0.4) / 10));
  scoreEl.textContent = score;

  // ---- Procedural platform generation (keep 3 screens below camera) ----
  const lowestPlatY = Math.min(...platforms.map(p => p.y));
  if (lowestPlatY > cameraY - canvas.height * 2) {
    generatePlatforms(lowestPlatY - currentGap(), cameraY - canvas.height * 3);
  }

  // ---- Cull platforms above camera + more than 1 screen off bottom ----
  platforms = platforms.filter(p =>
    p.y < cameraY + canvas.height + 100 &&
    p.y > cameraY - canvas.height * 2.5
  );

  // ---- Death check ----
  if (checkDeathBounds()) {
    triggerDeath();
    return;
  }

  // ---- Player walk animation ----
  if (Math.abs(player.vx) > 0.3) {
    player.frameTimer++;
    if (player.frameTimer > 6) { player.frame = (player.frame + 1) % 4; player.frameTimer = 0; }
  }

  // ---- Particles ----
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------------------------------------------------------------------------
// DEATH
// ---------------------------------------------------------------------------
function triggerDeath() {
  state = 'dead';
  if (score > best) {
    best = score;
    localStorage.setItem('iceTowerBest', best);
    bestEl.textContent = best;
    finalScore.textContent = 'YENİ REKOR: ' + score;
  } else {
    finalScore.textContent = 'SKOR: ' + score + '  |  EN IYI: ' + best;
  }
  startBtn.textContent = 'TEKRAR';
  overlay.style.display = 'flex';
  state = 'menu';
}

// ---------------------------------------------------------------------------
// INPUT HANDLING
// ---------------------------------------------------------------------------
// jumpHeld tracks whether jump is currently physically held down
// jumpBuffer is set on each fresh press so buffered jumps work

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && state === 'playing') {
    if (!jumpHeld) {                     // only buffer on fresh press, not hold
      player.jumpBuffer = JUMP_BUFFER_MAX;
    }
    jumpHeld = true;
  }
  if (e.key === 'Enter' && state === 'menu') startGame();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jumpHeld = false;
});

// Touch direction buttons
function holdStart(key) { keys[key] = true; }
function holdEnd(key)   { keys[key] = false; }

leftBtn.addEventListener('touchstart',  e => { e.preventDefault(); holdStart('left'); },  { passive: false });
leftBtn.addEventListener('touchend',    e => { e.preventDefault(); holdEnd('left'); },    { passive: false });
leftBtn.addEventListener('mousedown',   () => holdStart('left'));
leftBtn.addEventListener('mouseup',     () => holdEnd('left'));

rightBtn.addEventListener('touchstart', e => { e.preventDefault(); holdStart('right'); }, { passive: false });
rightBtn.addEventListener('touchend',   e => { e.preventDefault(); holdEnd('right'); },   { passive: false });
rightBtn.addEventListener('mousedown',  () => holdStart('right'));
rightBtn.addEventListener('mouseup',    () => holdEnd('right'));

// Jump button: set buffer on press, clear jumpHeld on release
jumpBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'playing') {
    player.jumpBuffer = JUMP_BUFFER_MAX;
    jumpHeld = true;
  }
}, { passive: false });
jumpBtn.addEventListener('touchend', e => {
  e.preventDefault();
  jumpHeld = false;
}, { passive: false });
jumpBtn.addEventListener('mousedown', () => {
  if (state === 'playing') { player.jumpBuffer = JUMP_BUFFER_MAX; jumpHeld = true; }
});
jumpBtn.addEventListener('mouseup', () => { jumpHeld = false; });

// Swipe-up on canvas
let touchStartY = 0;
canvas.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
canvas.addEventListener('touchend', e => {
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (dy > 30 && state === 'playing') {
    player.jumpBuffer = JUMP_BUFFER_MAX;
    jumpHeld = true;
    setTimeout(() => { jumpHeld = false; }, 80); // auto-release for swipe
  }
}, { passive: true });

startBtn.addEventListener('click', startGame);

function startGame() {
  jumpHeld = false;
  initGame();
  state = 'playing';
  overlay.style.display = 'none';
}

// ---------------------------------------------------------------------------
// DRAW — PLAYER
// ---------------------------------------------------------------------------
function drawPlayer() {
  const sx = player.x;
  const sy = player.y - cameraY;

  // Wall-slide visual: lean toward wall
  const wallLean = player.onWallLeft ? 0.15 : player.onWallRight ? -0.15 : 0;

  ctx.save();
  ctx.translate(sx + PLAYER_W / 2, sy + PLAYER_H / 2);
  if (player.dir < 0) ctx.scale(-1, 1);
  ctx.rotate(wallLean);

  // Body
  ctx.fillStyle = '#3af';
  ctx.beginPath();
  ctx.roundRect(-PLAYER_W/2+2, -PLAYER_H/2+8, PLAYER_W-4, PLAYER_H-10, 4);
  ctx.fill();

  // Head
  ctx.fillStyle = '#fdd';
  ctx.beginPath();
  ctx.ellipse(0, -PLAYER_H/2+4, 10, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(3, -PLAYER_H/2+1, 3, 3);

  // Hat
  ctx.fillStyle = '#07f';
  ctx.fillRect(-8, -PLAYER_H/2-6, 16, 6);
  ctx.fillRect(-5, -PLAYER_H/2-12, 10, 8);

  // Scarf
  ctx.fillStyle = '#f44';
  ctx.fillRect(-PLAYER_W/2+2, -PLAYER_H/2+19, PLAYER_W-4, 5);

  // Legs (animated)
  const legOff = Math.sin(player.frame * Math.PI / 2) * 5;
  ctx.fillStyle = '#08d';
  ctx.fillRect(-8, PLAYER_H/2-10, 7, 10 + legOff);
  ctx.fillRect( 1, PLAYER_H/2-10, 7, 10 - legOff);

  // Ice skates
  ctx.fillStyle = '#aef';
  ctx.fillRect(-10, PLAYER_H/2-2+legOff, 9, 4);
  ctx.fillRect(  1, PLAYER_H/2-2-legOff, 9, 4);

  ctx.restore();

  // Wall-slide spark effect
  if ((player.onWallLeft || player.onWallRight) && !player.onGround && player.vy > 0) {
    ctx.fillStyle = 'rgba(0,220,255,0.7)';
    const wx = player.onWallLeft ? sx : sx + PLAYER_W;
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(
        wx + (player.onWallLeft ? 1 : -4) + Math.random() * 4,
        sy + PLAYER_H * 0.5 + Math.random() * PLAYER_H * 0.4,
        2, 2
      );
    }
  }
}

// ---------------------------------------------------------------------------
// DRAW — PLATFORM
// ---------------------------------------------------------------------------
function drawPlatform(p) {
  const sy = p.y - cameraY;
  if (sy > canvas.height + 20 || sy < -30) return;

  ctx.save();

  if (p.type === 'bounce') {
    const grad = ctx.createLinearGradient(p.x, sy - p.h, p.x, sy + p.h);
    grad.addColorStop(0, '#ffa040');
    grad.addColorStop(1, '#c05000');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(p.x, sy - p.h / 2, p.w, p.h, 4);
    ctx.fill();
    ctx.strokeStyle = '#ffcc44';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffe';
    ctx.font = '10px sans-serif';
    ctx.fillText('^^', p.x + p.w / 2 - 8, sy - p.h / 2 - 2);

  } else if (p.type === 'crumble') {
    const crack = p.crumbleTimer / 20;
    ctx.globalAlpha = 1 - crack * 0.7;
    const grad = ctx.createLinearGradient(p.x, sy - p.h, p.x, sy + p.h);
    grad.addColorStop(0, '#ff6060');
    grad.addColorStop(1, '#900');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(p.x, sy - p.h / 2, p.w, p.h, 3);
    ctx.fill();
    if (crack > 0.3) {
      ctx.strokeStyle = '#f00';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x + p.w * 0.3, sy - p.h / 2);
      ctx.lineTo(p.x + p.w * 0.5, sy + p.h / 2);
      ctx.moveTo(p.x + p.w * 0.6, sy - p.h / 2);
      ctx.lineTo(p.x + p.w * 0.45, sy + p.h / 2);
      ctx.stroke();
    }

  } else {
    // Normal ice platform
    const grad = ctx.createLinearGradient(p.x, sy - p.h, p.x, sy + p.h * 2);
    grad.addColorStop(0,   '#b8f0ff');
    grad.addColorStop(0.4, '#60c8f0');
    grad.addColorStop(1,   '#2080c0');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(p.x, sy - p.h / 2, p.w, p.h, 5);
    ctx.fill();

    // Specular shine
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.roundRect(p.x + 4, sy - p.h / 2 + 2, p.w - 8, p.h / 2 - 1, 3);
    ctx.fill();

    // Ice crystals
    ctx.strokeStyle = 'rgba(200,240,255,0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const cx = p.x + p.w * (0.2 + i * 0.3);
      const cy = sy - p.h / 2 + 1;
      ctx.beginPath();
      ctx.moveTo(cx, cy);     ctx.lineTo(cx, cy - 5);
      ctx.moveTo(cx-3, cy-2); ctx.lineTo(cx+3, cy-2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

// ---------------------------------------------------------------------------
// DRAW — BACKGROUND
// ---------------------------------------------------------------------------
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#050518');
  grad.addColorStop(1, '#0a1535');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Parallax stars
  ctx.fillStyle = 'rgba(200,220,255,0.6)';
  const starSeed = Math.floor(cameraY / 200);
  for (let i = 0; i < 40; i++) {
    const s  = Math.sin(i * 7.3 + starSeed) * 0.5 + 0.5;
    const sx = (i * 137.5) % canvas.width;
    const sy = ((i * 97.3 + cameraY * 0.05) % canvas.height + canvas.height) % canvas.height;
    ctx.fillRect(sx, sy, s * 2 + 0.5, s * 2 + 0.5);
  }

  // Tower wall guides
  ctx.strokeStyle = 'rgba(100,180,255,0.12)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 16]);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, canvas.height);
  ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Brick / ice block pattern on sides
  ctx.strokeStyle = 'rgba(80,140,200,0.08)';
  ctx.lineWidth = 1;
  const brickH   = 30;
  const brickW   = 20;
  const camOff   = ((-cameraY) % brickH + brickH) % brickH;
  for (let row = -1; row < canvas.height / brickH + 2; row++) {
    const y      = row * brickH + camOff;
    const offset = (row % 2) * brickW * 0.5;
    for (let col = 0; col < 3; col++) {
      ctx.strokeRect(col * brickW + offset - brickW, y, brickW, brickH);
      ctx.strokeRect(canvas.width - col * brickW - offset, y, brickW, brickH);
    }
  }
}

// ---------------------------------------------------------------------------
// DRAW — FREEZE WALL
// ---------------------------------------------------------------------------
function drawFreezeWall() {
  const wallY = dangerY - cameraY; // screen Y of the freeze wall

  // Glow gradient above the wall
  const grad = ctx.createLinearGradient(0, wallY - 40, 0, wallY + 20);
  grad.addColorStop(0,   'rgba(0,200,255,0)');
  grad.addColorStop(0.5, 'rgba(0,180,255,0.35)');
  grad.addColorStop(1,   'rgba(0,240,255,0.75)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, wallY - 40, canvas.width, 60);

  // Solid ice line
  ctx.fillStyle = 'rgba(0,240,255,0.9)';
  ctx.fillRect(0, wallY + 18, canvas.width, 2);

  // Animated icicles
  ctx.fillStyle = '#7ef';
  for (let i = 0; i < 12; i++) {
    const ix = (i / 11) * canvas.width;
    const ih = 10 + Math.sin(Date.now() * 0.003 + i) * 8 + i * 2;
    ctx.beginPath();
    ctx.moveTo(ix - 6, wallY + 2);
    ctx.lineTo(ix + 6, wallY + 2);
    ctx.lineTo(ix, wallY + ih);
    ctx.closePath();
    ctx.fill();
  }

  // Blinking warning text
  if (Math.floor(Date.now() / 300) % 2 === 0) {
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('! DONMA YAKLASIYOR !', canvas.width / 2, wallY + 38);
    ctx.textAlign = 'left';
  }
}

// ---------------------------------------------------------------------------
// DRAW — PARTICLES
// ---------------------------------------------------------------------------
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - cameraY, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// DRAW — HUD OVERLAY (danger proximity vignette)
// ---------------------------------------------------------------------------
function drawHUD() {
  const playerScreenY = player.y - cameraY;
  const wallScreenY   = dangerY  - cameraY;
  const dist = playerScreenY - wallScreenY;
  if (dist < 200) {
    const alpha = 1 - dist / 200;
    ctx.fillStyle = `rgba(0,200,255,${alpha * 0.18})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Wall-jump hint when touching wall in air
  if ((player.onWallLeft || player.onWallRight || player.wallGrace > 0) && !player.onGround) {
    ctx.fillStyle = 'rgba(0,255,200,0.7)';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('WALL JUMP!', canvas.width / 2, canvas.height * 0.15);
    ctx.textAlign = 'left';
  }
}

// ---------------------------------------------------------------------------
// GAME LOOP
// ---------------------------------------------------------------------------
function loop() {
  update();

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  for (const p of platforms) drawPlatform(p);
  drawParticles();

  if (state === 'playing') {
    drawPlayer();
    drawFreezeWall();
    drawHUD();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
