<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<!-- ================================================================
     iOS / PWA FULL-SCREEN META TAGS
     ================================================================ -->
<!-- Viewport: no scaling, fill device, respect notch safe areas -->
<meta name="viewport" content="width=device-width, initial-scale=1.0,
      viewport-fit=cover, user-scalable=no, maximum-scale=1.0">

<!-- iOS: hides Safari chrome when launched from Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent → our bg bleeds behind status bar on iOS -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ice Tower">

<!-- Android / Chrome PWA -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a2e">
<meta name="application-name" content="Ice Tower">

<!-- Disable phone number detection, tap highlight, etc. -->
<meta name="format-detection" content="telephone=no">

<!-- Manifest + apple-touch-icon injected as blob URLs in JS below -->
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="apple-touch-icon">

<title>Ice Tower</title>
<style>
/* ================================================================
   RESET + SAFE AREA CUSTOM PROPERTIES
   ================================================================ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  /* Kill all native touch gestures globally; re-enable selectively */
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

:root {
  /* Safe-area insets – fall back to 0 on non-notch devices */
  --sat: env(safe-area-inset-top,    0px);
  --sar: env(safe-area-inset-right,  0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left,   0px);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0a2e;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100dvh;   /* dynamic viewport height (iOS 15.4+) */
  height: 100vh;    /* fallback */
  font-family: 'Courier New', monospace;
  position: fixed;  /* prevent elastic overscroll on iOS */
  inset: 0;
}

/* ================================================================
   HUD STRIP – below status bar (notch / Dynamic Island)
   ================================================================ */
#ui {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: calc(var(--sat) + 8px) 16px 8px;
  background: rgba(0,0,30,0.85);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 10;
  color: #7ff;
  font-size: 15px;
  font-weight: bold;
}

/* ================================================================
   CANVAS
   ================================================================ */
#canvas {
  display: block;
  background: #08082a;
}

/* ================================================================
   OVERLAY (menu / game-over)
   ================================================================ */
#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding:
    calc(var(--sat) + 20px)
    calc(var(--sar) + 20px)
    calc(var(--sab) + 20px)
    calc(var(--sal) + 20px);
  background: rgba(0,0,30,0.93);
  z-index: 20;
  color: #fff;
  text-align: center;
  gap: 18px;
}
#overlay h1 {
  font-size: 2.8em;
  color: #7ff;
  text-shadow: 0 0 20px #0ff, 0 0 40px #07f;
  letter-spacing: 4px;
}
#overlay p { font-size: 1em; color: #adf; max-width: 280px; line-height: 1.6; }
#overlay .score-display { font-size: 1.5em; color: #ff7; }
#startBtn {
  margin-top: 10px;
  padding: 16px 48px;
  background: linear-gradient(135deg, #0af, #07f);
  color: #fff;
  font-size: 1.3em;
  font-weight: bold;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: 0 0 24px #0af;
  touch-action: manipulation; /* no 300ms delay */
}
#startBtn:active { transform: scale(0.96); }

/* ================================================================
   VIRTUAL JOYSTICK  (anchored to LEFT half of screen)
   ================================================================ */
#joystick-zone {
  position: fixed;
  left: 0; bottom: 0;
  width: 50%;
  height: calc(50% + var(--sab));
  z-index: 11;
}

/* Outer ring – appears where the thumb first lands */
#joystick-base {
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 2.5px solid rgba(120,220,255,0.4);
  background: rgba(0,100,180,0.15);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  transform: translate(-50%, -50%);
  display: none;
  pointer-events: none;
}

/* Nub – follows thumb within RADIUS */
#joystick-nub {
  position: absolute;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #5cf, #07c);
  border: 2px solid rgba(180,240,255,0.6);
  box-shadow: 0 0 12px #0af;
  transform: translate(-50%, -50%);
  display: none;
  pointer-events: none;
}

/* ================================================================
   RIGHT HALF – JUMP ZONE
   ================================================================ */
#jump-zone {
  position: fixed;
  right: 0; bottom: 0;
  width: 50%;
  height: calc(50% + var(--sab));
  z-index: 11;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: calc(var(--sab) + 16px);
}

/* Subtle hint ring – always visible so player knows the zone */
#jump-hint {
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 3px solid rgba(255,200,80,0.35);
  background: rgba(255,140,0,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,220,120,0.6);
  font-size: 2em;
  pointer-events: none;
  transition: background 0.08s, border-color 0.08s;
}
#jump-zone.pressing #jump-hint {
  background: rgba(255,200,0,0.35);
  border-color: #ff0;
  color: #ff0;
}
</style>
</head>
<body>

<!-- HUD -->
<div id="ui">
  <span>SKOR: <span id="scoreEl">0</span></span>
  <span>&#10052; ICE TOWER</span>
  <span>EN IYI: <span id="bestEl">0</span></span>
</div>

<canvas id="canvas"></canvas>

<!-- Virtual joystick DOM nodes (positioned by JS) -->
<div id="joystick-zone">
  <div id="joystick-base"></div>
  <div id="joystick-nub"></div>
</div>

<!-- Right-half jump zone -->
<div id="jump-zone">
  <div id="jump-hint">&#8593;</div>
</div>

<!-- Menu / Game-over overlay -->
<div id="overlay">
  <h1>&#10052; ICE<br>TOWER</h1>
  <p>Platformlara zipla, asagi in!<br>Ne kadar derine inebilirsin?<br><br>Duvara yapisip duvardan zipla!</p>
  <div class="score-display" id="finalScore"></div>
  <button id="startBtn">BASLA</button>
  <p style="font-size:0.85em; color:#68a; margin-top:-8px;">
    Sol: Joystick &nbsp;|&nbsp; Sag: Zipla<br>
    &#9664; &#9654; klavye &nbsp;|&nbsp; SPACE zipla
  </p>
</div>

<script>
/* ================================================================
   0.  PWA BOOTSTRAP  (runs synchronously before the game loop)
   ================================================================ */

// ----------------------------------------------------------------
// 0a. Generate icons via Canvas – no external files required
//     Draws a detailed 6-arm snowflake on a rounded-square bg
// ----------------------------------------------------------------
function generateIconDataURL(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cx = size / 2, cy = size / 2;
  const R  = size / 2;

  // Rounded square background (navy gradient)
  const bg = g.createRadialGradient(cx, cy * 0.7, 0, cx, cy, R);
  bg.addColorStop(0, '#1a2a6e');
  bg.addColorStop(1, '#04041a');
  g.fillStyle = bg;
  g.beginPath();
  g.roundRect(0, 0, size, size, size * 0.22);
  g.fill();

  // --- 6-arm snowflake ---
  const S = size * 0.38; // arm length
  g.save();
  g.translate(cx, cy);

  // Outer glow
  g.shadowColor = '#0cf';
  g.shadowBlur  = size * 0.12;

  for (let arm = 0; arm < 6; arm++) {
    g.save();
    g.rotate((arm * Math.PI) / 3);

    // Main arm
    const armGrad = g.createLinearGradient(0, 0, 0, -S);
    armGrad.addColorStop(0, '#7ef8ff');
    armGrad.addColorStop(1, '#b0f0ff');
    g.strokeStyle = armGrad;
    g.lineWidth   = size * 0.04;
    g.lineCap     = 'round';
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(0, -S);
    g.stroke();

    // Branch pairs at 33% and 60% of arm
    [0.33, 0.60].forEach((frac, bi) => {
      const bLen = S * (0.38 - bi * 0.10);
      const bY   = -S * frac;
      g.lineWidth   = size * 0.025;
      g.strokeStyle = '#c0f8ff';

      g.beginPath();
      g.moveTo(0, bY);
      g.lineTo(-bLen * 0.866, bY - bLen * 0.5);
      g.stroke();

      g.beginPath();
      g.moveTo(0, bY);
      g.lineTo( bLen * 0.866, bY - bLen * 0.5);
      g.stroke();

      // Tiny diamond tips on outer branches
      if (bi === 0) {
        g.fillStyle = '#e8fcff';
        [-1, 1].forEach(side => {
          const tx = side * bLen * 0.866, ty = bY - bLen * 0.5;
          const ds = size * 0.038;
          g.beginPath();
          g.moveTo(tx, ty - ds);
          g.lineTo(tx + ds, ty);
          g.lineTo(tx, ty + ds);
          g.lineTo(tx - ds, ty);
          g.closePath();
          g.fill();
        });
      }
    });

    // Tip diamond
    const ds = size * 0.052;
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.moveTo(0,     -S - ds);
    g.lineTo(ds * 0.65, -S);
    g.lineTo(0,     -S + ds);
    g.lineTo(-ds * 0.65, -S);
    g.closePath();
    g.fill();

    g.restore();
  }

  // Center hexagon
  g.fillStyle  = '#c8f8ff';
  g.shadowBlur = size * 0.06;
  g.shadowColor = '#fff';
  g.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i * Math.PI) / 3 - Math.PI / 6;
    const r = size * 0.075;
    i === 0 ? g.moveTo(Math.cos(a)*r, Math.sin(a)*r)
            : g.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  g.closePath();
  g.fill();

  // Bright centre dot
  g.fillStyle   = '#ffffff';
  g.shadowBlur  = size * 0.10;
  g.shadowColor = '#aff';
  g.beginPath();
  g.arc(0, 0, size * 0.028, 0, Math.PI * 2);
  g.fill();

  g.restore();
  return c.toDataURL('image/png');
}

const icon512 = generateIconDataURL(512);
const icon192 = generateIconDataURL(192);
const icon180 = generateIconDataURL(180); // apple-touch-icon standard size

// Set apple-touch-icon (must be ready before "Add to Home Screen")
document.getElementById('apple-touch-icon').href = icon180;

// ----------------------------------------------------------------
// 0b. Inline PWA Manifest via Blob URL
//     (works in single-file context where there is no manifest.json)
// ----------------------------------------------------------------
(function injectManifest() {
  const manifest = {
    name:             'Ice Tower',
    short_name:       'Ice Tower',
    description:      'Endless ice tower platformer – jump down as far as you can!',
    display:          'standalone',
    orientation:      'portrait',
    start_url:        '.',
    scope:            '.',
    theme_color:      '#0a0a2e',
    background_color: '#0a0a2e',
    prefer_related_applications: false,
    categories:       ['games'],
    lang:             'tr',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
})();

// ----------------------------------------------------------------
// 0c. Service Worker – cache-first offline strategy
//     Full SW code as a string → Blob → Object URL → register
// ----------------------------------------------------------------
(function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;

  // Complete service-worker source.
  // Delivered as a blob: URL so no separate sw.js file is needed.
  const SW_SOURCE = `
const CACHE_NAME = 'ice-tower-v1';

// Derive the page URL from the SW's location so we can pre-cache it.
// The SW blob URL is something like blob:https://example.com/uuid,
// but self.registration.scope gives us the actual page scope.
const PAGE_SCOPE = self.registration.scope;

// ---- Install: pre-cache the page ----
self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME).then(cache =>
      fetch(PAGE_SCOPE, { cache: 'reload' })
        .then(res => { if (res.ok) cache.put(PAGE_SCOPE, res); })
        .catch(() => {}) // graceful – offline on first ever install
    ).then(() => self.skipWaiting())
  );
});

// ---- Activate: purge stale caches ----
self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys()
      .then(keys => Promise.all(
        keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))
      ))
      .then(() => self.clients.claim())
  );
});

// ---- Fetch: cache-first with background revalidation ----
self.addEventListener('fetch', event => {
  if (event.request.method !== 'GET') return;

  event.respondWith(
    caches.match(event.request).then(cached => {
      // Serve from cache immediately, revalidate in background
      if (cached) {
        fetch(event.request)
          .then(fresh => {
            if (fresh && fresh.status === 200) {
              caches.open(CACHE_NAME).then(c => c.put(event.request, fresh));
            }
          })
          .catch(() => {});
        return cached;
      }

      // Not cached – fetch, cache, and return
      return fetch(event.request).then(res => {
        if (res && res.status === 200 && res.type !== 'opaque') {
          const clone = res.clone();
          caches.open(CACHE_NAME).then(c => c.put(event.request, clone));
        }
        return res;
      }).catch(() => {
        // Navigation fallback: return cached page shell
        if (event.request.mode === 'navigate') {
          return caches.match(PAGE_SCOPE);
        }
      });
    })
  );
});
`;

  const swBlob = new Blob([SW_SOURCE], { type: 'application/javascript' });
  const swURL  = URL.createObjectURL(swBlob);

  navigator.serviceWorker.register(swURL, { scope: './' })
    .then(reg => {
      console.log('[Ice Tower SW] registered – scope:', reg.scope);
    })
    .catch(err => {
      // Blob-URL SW is blocked in some strict contexts (e.g. Firefox).
      // Game still works perfectly – just no offline caching.
      console.warn('[Ice Tower SW] registration skipped:', err.message);
    });
})();

// ----------------------------------------------------------------
// 0d. Screen Orientation Lock  (portrait)
// ----------------------------------------------------------------
(function lockOrientation() {
  const doLock = () => {
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(() => {});
      } else if (screen.lockOrientation) {
        screen.lockOrientation('portrait');
      } else if (screen.mozLockOrientation) {
        screen.mozLockOrientation('portrait');
      }
    } catch (e) {}
  };
  // Try on page load and on first user interaction (required on some browsers)
  doLock();
  document.addEventListener('click',      doLock, { once: true });
  document.addEventListener('touchstart', doLock, { once: true });
})();

/* ================================================================
   1.  CANVAS SETUP + RESPONSIVE RESIZE
   ================================================================ */
const canvas     = document.getElementById('canvas');
const ctx        = canvas.getContext('2d');
const overlay    = document.getElementById('overlay');
const scoreEl    = document.getElementById('scoreEl');
const bestEl     = document.getElementById('bestEl');
const finalScore = document.getElementById('finalScore');
const startBtn   = document.getElementById('startBtn');

function resize() {
  canvas.width  = Math.min(window.innerWidth, 480);
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ================================================================
   2.  HAPTIC FEEDBACK
   ================================================================ */
const Haptic = {
  _v: p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} },
  land:     () => Haptic._v(20),
  jump:     () => Haptic._v(10),
  death:    () => Haptic._v([50, 30, 50]),
  wallJump: () => Haptic._v(15),
  bounce:   () => Haptic._v([8, 10, 8])
};

/* ================================================================
   3.  PHYSICS CONSTANTS
   ================================================================ */
const GRAVITY           = 0.45;
const JUMP_FORCE        = -11.0;
const JUMP_CUT_FACTOR   = 0.50;
const MAX_FALL_SPEED    = 18;
const MAX_RUN_SPEED     = 6.0;
const RUN_ACCEL         = 1.2;
const GROUND_FRICTION   = 0.82;
const AIR_FRICTION      = 0.95;

// Wall mechanics
const WALL_SLIDE_MAX_VY = 2.0;
const WALL_JUMP_SPEED   = 9.0;
const WALL_JUMP_VX      = WALL_JUMP_SPEED * 0.5;    // ≈ 4.5
const WALL_JUMP_VY      = -(WALL_JUMP_SPEED * 0.866); // ≈ -7.79
const WALL_JUMP_GRACE   = 6;

// Timing
const COYOTE_FRAMES     = 8;
const JUMP_BUFFER_MAX   = 10;

// Dimensions
const PLAYER_W  = 28;
const PLAYER_H  = 36;
const PLATFORM_H = 14;

// Scrolling / difficulty
const SCROLL_SPEED_BASE   = 1.2;
const PLATFORM_GAP_START  = 90;
const PLATFORM_GAP_MAX    = 140;
const SCORE_GAP_THRESHOLD = 500;

// Sub-step size for swept collision (prevents tunneling)
const SUB_STEP = 8;

/* ================================================================
   4.  VIRTUAL JOYSTICK  (left half of screen)
   ================================================================ */
const jZone = document.getElementById('joystick-zone');
const jBase = document.getElementById('joystick-base');
const jNub  = document.getElementById('joystick-nub');

const joy = {
  active:  false,
  touchId: null,
  ox: 0, oy: 0,   // origin within joystick-zone
  dx: 0, dy: 0,   // current offset
  RADIUS: 60,     // max nub travel (px)
  DEAD: 8         // inner dead-zone (px)
};

// Public movement flags consumed by physics
let joyLeft  = false;
let joyRight = false;
// Proportional magnitude [0..1] for smooth speed scaling
let joyMag   = 1;

function joyStart(id, cx, cy) {
  if (joy.active) return;
  joy.active  = true;
  joy.touchId = id;
  const rect = jZone.getBoundingClientRect();
  joy.ox = cx - rect.left;
  joy.oy = cy - rect.top;
  joy.dx = joy.dy = 0;
  joyLeft = joyRight = false;
  joyMag  = 0;

  jBase.style.left = joy.ox + 'px';
  jBase.style.top  = joy.oy + 'px';
  jNub.style.left  = joy.ox + 'px';
  jNub.style.top   = joy.oy + 'px';
  jBase.style.display = jNub.style.display = 'block';
}

function joyMove(id, cx, cy) {
  if (!joy.active || joy.touchId !== id) return;
  const rect  = jZone.getBoundingClientRect();
  const dx    = (cx - rect.left) - joy.ox;
  const dy    = (cy - rect.top)  - joy.oy;
  const dist  = Math.sqrt(dx * dx + dy * dy);
  const clamp = Math.min(dist, joy.RADIUS);
  const angle = Math.atan2(dy, dx);
  joy.dx = Math.cos(angle) * clamp;
  joy.dy = Math.sin(angle) * clamp;

  jNub.style.left = (joy.ox + joy.dx) + 'px';
  jNub.style.top  = (joy.oy + joy.dy) + 'px';

  joyLeft  = joy.dx < -joy.DEAD;
  joyRight = joy.dx >  joy.DEAD;
  joyMag   = Math.min(Math.abs(joy.dx) / joy.RADIUS, 1);
}

function joyEnd(id) {
  if (joy.touchId !== id) return;
  joy.active  = false;
  joy.touchId = null;
  joy.dx = joy.dy = 0;
  joyLeft = joyRight = false;
  joyMag  = 1;
  jBase.style.display = jNub.style.display = 'none';
}

jZone.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) joyStart(t.identifier, t.clientX, t.clientY);
}, { passive: false });

jZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) joyMove(t.identifier, t.clientX, t.clientY);
}, { passive: false });

jZone.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) joyEnd(t.identifier);
}, { passive: false });

jZone.addEventListener('touchcancel', e => {
  e.preventDefault();
  for (const t of e.changedTouches) joyEnd(t.identifier);
}, { passive: false });

/* ================================================================
   5.  RIGHT HALF – JUMP ZONE  (tap + swipe-up)
   ================================================================ */
const jumpZone   = document.getElementById('jump-zone');
const jumpTouches = new Map(); // touchId → startY
let jumpHeld = false;

function jumpPress() {
  if (state === 'playing') {
    player.jumpBuffer = JUMP_BUFFER_MAX;
    jumpHeld = true;
  }
}
function jumpRelease() { jumpHeld = false; }

jumpZone.addEventListener('touchstart', e => {
  e.preventDefault();
  jumpZone.classList.add('pressing');
  for (const t of e.changedTouches) {
    jumpTouches.set(t.identifier, t.clientY);
  }
  jumpPress();
}, { passive: false });

jumpZone.addEventListener('touchmove', e => {
  e.preventDefault();
  // Swipe-up detection
  for (const t of e.changedTouches) {
    const startY = jumpTouches.get(t.identifier);
    if (startY !== undefined && startY - t.clientY > 25) {
      jumpPress();
      jumpTouches.set(t.identifier, t.clientY); // reset to avoid repeat
    }
  }
}, { passive: false });

jumpZone.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) jumpTouches.delete(t.identifier);
  if (jumpTouches.size === 0) { jumpZone.classList.remove('pressing'); jumpRelease(); }
}, { passive: false });

jumpZone.addEventListener('touchcancel', e => {
  e.preventDefault();
  for (const t of e.changedTouches) jumpTouches.delete(t.identifier);
  if (jumpTouches.size === 0) { jumpZone.classList.remove('pressing'); jumpRelease(); }
}, { passive: false });

/* ================================================================
   6.  KEYBOARD CONTROLS  (desktop / MFi controllers via keyboard)
   ================================================================ */
const keys = { left: false, right: false };

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && state === 'playing') {
    if (!jumpHeld) player.jumpBuffer = JUMP_BUFFER_MAX;
    jumpHeld = true;
  }
  if (e.key === 'Enter' && state === 'menu') startGame();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jumpHeld = false;
});

/* ================================================================

/* ================================================================
   8b. WEB AUDIO SYNTHESIZED SOUND EFFECTS
   ================================================================ */
let _ac = null;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}

function _gain(ac, vol, t0, t1) {
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.linearRampToValueAtTime(0.0001, t1);
  g.connect(ac.destination);
  return g;
}

/* Jump: 200→420 Hz sine sweep, 0.12s */
function playJump() {
  if (!save.settings.sound) return;
  const ac = getAC(), t = ac.currentTime;
  const o  = ac.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(200, t);
  o.frequency.linearRampToValueAtTime(420, t + 0.10);
  o.connect(_gain(ac, 0.18, t, t + 0.12));
  o.start(t); o.stop(t + 0.13);
}

/* Wall jump: 150→500→280 Hz sawtooth, 0.17s */
function playWallJump() {
  if (!save.settings.sound) return;
  const ac = getAC(), t = ac.currentTime;
  const o  = ac.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(500, t + 0.10);
  o.frequency.linearRampToValueAtTime(280, t + 0.17);
  o.connect(_gain(ac, 0.20, t, t + 0.17));
  o.start(t); o.stop(t + 0.18);
}

/* Land: sine thud 90→58 Hz + noise burst */
function playSfxLand() {
  if (!save.settings.sound) return;
  const ac = getAC(), t = ac.currentTime;
  const o  = ac.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(90, t);
  o.frequency.linearRampToValueAtTime(58, t + 0.06);
  o.connect(_gain(ac, 0.20, t, t + 0.06));
  o.start(t); o.stop(t + 0.07);
  const len = Math.ceil(ac.sampleRate * 0.04);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d   = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  src.connect(_gain(ac, 0.10, t, t + 0.04)); src.start(t);
}

/* Bounce pad: boing 200→90→240 Hz, 0.22s */
function playBouncePad() {
  if (!save.settings.sound) return;
  const ac = getAC(), t = ac.currentTime;
  const o  = ac.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(200, t);
  o.frequency.linearRampToValueAtTime(90, t + 0.10);
  o.frequency.linearRampToValueAtTime(240, t + 0.20);
  o.connect(_gain(ac, 0.24, t, t + 0.22));
  o.start(t); o.stop(t + 0.23);
}

/* Crumble: 4 noise bursts spaced 45ms apart */
function playCrumble() {
  if (!save.settings.sound) return;
  const ac = getAC(), t = ac.currentTime;
  for (let b = 0; b < 4; b++) {
    const dt  = b * 0.045;
    const len = Math.ceil(ac.sampleRate * 0.03);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    src.connect(_gain(ac, 0.13 - b * 0.025, t + dt, t + dt + 0.03));
    src.start(t + dt);
  }
}

/* Death: sawtooth 320→40 Hz descent + noise crash */
function playDeath() {
  if (!save.settings.sound) return;
  const ac = getAC(), t = ac.currentTime;
  const o  = ac.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(320, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.80);
  o.connect(_gain(ac, 0.30, t, t + 0.85));
  o.start(t); o.stop(t + 0.90);
  const len = Math.ceil(ac.sampleRate * 0.6);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d   = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.18));
  const src = ac.createBufferSource(); src.buffer = buf;
  src.connect(_gain(ac, 0.25, t, t + 0.60)); src.start(t);
}

/* Milestone ding: ascending C5-E5-G5 triad, spaced 100ms */
function playMilestone() {
  if (!save.settings.sound) return;
  const ac = getAC(), t = ac.currentTime;
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const dt = i * 0.10;
    const o  = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t + dt);
    o.connect(_gain(ac, 0.17, t + dt, t + dt + 0.28));
    o.start(t + dt); o.stop(t + dt + 0.30);
  });
}

/* ================================================================
   8c. SEEDED PRNG  (mulberry32 – deterministic, no Math.random in gen)
   ================================================================ */
function makePRNG(seed) {
  let s = (seed >>> 0) || 1;
  return function() {
    s += 0x6D2B79F5;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function updatePopups() {
  for (const p of popups) {
    p.y    += p.vy;
    p.life -= 0.018;
    p.el.style.top     = p.y + 'px';
    p.el.style.opacity = Math.max(0, p.life).toFixed(2);
  }
  popups = popups.filter(p => { if (p.life <= 0) { p.el.remove(); return false; } return true; });
}

/* ================================================================
   9.  GAME STATE VARIABLES
   ================================================================ */
let state      = 'menu';
let score      = 0;
let cameraY    = 0;
let platforms  = [];
let particles  = [];
let player;
let frameCount = 0;
let dangerY    = -200;

/* Scoring extras */
let _depth       = 0;   // pixel depth (positive = deeper)
let _combo       = 0;
let _comboTimer  = 0;
let _peakCombo   = 0;
let _sessionStart = 0;
let _nextMilestone = 100;  // depth-meters for next milestone sound
let _lastSafeZone  = -1;   // last safe-zone index generated

/* Slow-motion death */
let _dyingTimer  = 0;   // frames until results screen
let _slowMo      = false;
const SLOW_FACTOR = 0.20;

/* Seeded RNG for level generation */
let _rng = Math.random;  // replaced on initGame

/* ================================================================
   9b. COMBO SCORING HELPERS
   ================================================================ */
function onPlatformLand(type) {
  _combo = Math.min(_combo + 1, 4);
  _comboTimer = 130;
  if (_combo > _peakCombo) _peakCombo = _combo;

  if (_combo >= 2) {
    const pts  = 10 * _combo;
    const psx  = player.x + PLAYER_W / 2;
    const psy  = player.y - cameraY - 28;
    const cols = ['', '', '#ffcc00', '#ff9900', '#ff3300'];
    spawnPopup(psx, psy, '+' + pts + ' COMBO x' + _combo, cols[_combo]);
    if (save.settings.haptic) { try { navigator.vibrate(10 + _combo * 5); } catch(e) {} }
  }
}

function computeScore() {
  const base = _depth / 10;
  // Speed bonus: falling faster than average camera scroll rate
  const avgDepthPx = frameCount * SCROLL_SPEED_BASE * 10;
  const speedMult  = _depth > avgDepthPx ? 1.3 : 1.0;
  // Combo multiplier: 1x–4x, blended at 50% weight
  const comboMult  = 1 + ((_combo / 4) * 3);
  return Math.floor(base * speedMult * (1 + (comboMult - 1) * 0.5));
}

/* ================================================================
   9c. HELPERS
   ================================================================ */
function lerp(a, b, t) { return a + (b - a) * t; }

/* ================================================================
   10. PARTICLES  (seeded)
   ================================================================ */
function spawnParticles(x, y, color, n, upward) {
  for (let i = 0; i < n; i++) {
    const a = upward
      ? (-Math.PI / 2 + (_rng() - 0.5) * Math.PI)
      : _rng() * Math.PI * 2;
    const spd = 1.5 + _rng() * 3.5;
    particles.push({
      x, y, color,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 1, decay: 0.03 + _rng() * 0.04, r: 2 + _rng() * 3
    });
  }
}

/* ================================================================
   11. PROCEDURAL LEVEL GENERATION  (seeded PRNG, reachability guaranteed)
   ================================================================
   Player max air time ≈ 2 * |JUMP_FORCE| / GRAVITY = 2*11/0.45 ≈ 49 frames
   Max horizontal reach: MAX_RUN_SPEED * 49 ≈ 294px → conservative 300px.
   Each new platform center is constrained within ±MAX_REACH_X of the
   previous anchor center, guaranteeing every step is beatable.
   ================================================================ */
const MAX_REACH_X        = 300;
const SAFE_ZONE_INTERVAL = 500;   // score-meters between safe zones
const PLAT_MIN_W         = 55;
const PLAT_MAX_W         = 130;

function currentGap(ds) {
  // 80–100px near surface, widens to 140–160px at depth 1000m+
  return 80 + Math.min(ds / 1000, 1) * 60 + _rng() * 20;
}

function buildPlatform(x, y, w, type) {
  return {
    x, y, w, h: PLATFORM_H, type,
    crumbled: false, crumbleTimer: 0, firstTouch: true,
    moveDir: _rng() < 0.5 ? 1 : -1,
    moveRange: 55 + _rng() * 80,
    moveOrigin: x
  };
}

function generatePlatforms(fromY, toY) {
  let y       = fromY;
  let anchors = platforms.filter(p => Math.abs(p.y - fromY) < 220).map(p => ({ x: p.x, w: p.w }));
  if (anchors.length === 0) anchors = [{ x: canvas.width / 2 - 70, w: 140 }];

  while (y > toY) {
    const ds = Math.max(0, Math.floor((-y + canvas.height * 0.4) / 10));

    // Safe zone: dense cluster every SAFE_ZONE_INTERVAL score-meters
    const szIdx = Math.floor(ds / SAFE_ZONE_INTERVAL);
    if (szIdx > _lastSafeZone && ds > 0) {
      _lastSafeZone = szIdx;
      const sw   = 118;
      const cols = [0.08, 0.38, 0.62, 0.20];
      const na   = [];
      for (let i = 0; i < 4; i++) {
        const py = y - i * 65;
        const px = Math.max(0, Math.min(canvas.width - sw, cols[i] * canvas.width));
        platforms.push(buildPlatform(px, py, sw, 'normal'));
        na.push({ x: px, w: sw });
      }
      anchors = na;
      y -= 65 * 4 + 55;
      continue;
    }

    const gap    = currentGap(ds);
    const anchor = anchors[Math.floor(_rng() * anchors.length)];
    const platW  = PLAT_MIN_W + Math.floor(_rng() * (PLAT_MAX_W - PLAT_MIN_W));
    const acx    = anchor.x + anchor.w / 2;

    // Reachability constraint: new platform center within ±MAX_REACH_X of anchor
    const minX  = Math.max(0, acx - MAX_REACH_X - platW * 0.5);
    const maxX  = Math.min(canvas.width - platW, acx + MAX_REACH_X - platW * 0.5);
    const platX = minX + _rng() * Math.max(0, maxX - minX);

    // Type: moving unlocks after depth 200, distribution is depth-aware
    let type = 'normal';
    const r  = _rng();
    if (ds > 200 && r < 0.09)     type = 'moving';
    else if (ds > 50 && r < 0.19) type = 'crumble';
    else if (r < 0.27)             type = 'bounce';

    platforms.push(buildPlatform(platX, y, platW, type));
    anchors = [{ x: platX, w: platW }];
    y -= gap;
  }
}

function updateMovingPlatforms() {
  const ds = Math.max(0, Math.floor(_depth / 10));
  if (ds < 200) return;
  const spd = 0.8 + (ds - 200) / 800;
  for (const p of platforms) {
    if (p.type !== 'moving' || p.crumbled) continue;
    p.x += p.moveDir * spd;
    const lo = Math.max(0, p.moveOrigin - p.moveRange * 0.5);
    const hi = Math.min(canvas.width - p.w, p.moveOrigin + p.moveRange);
    if (p.x >= hi) { p.x = hi; p.moveDir = -1; }
    if (p.x <= lo) { p.x = lo; p.moveDir =  1; }
  }
}

/* ================================================================
   13. SWEPT AABB COLLISION  (sub-stepped to prevent tunneling)
   ================================================================ */
function sweepAxis(axis, delta) {
  const result  = { landed: false, hitCeiling: false };
  const steps   = Math.max(1, Math.ceil(Math.abs(delta) / SUB_STEP));
  const step    = delta / steps;

  for (let s = 0; s < steps; s++) {
    if (axis === 'x') player.x += step;
    else              player.y += step;

    for (const plat of platforms) {
      if (plat.crumbled) continue;
      const ox = player.x < plat.x + plat.w && player.x + PLAYER_W > plat.x;
      const oy = player.y < plat.y + plat.h && player.y + PLAYER_H > plat.y;
      if (!ox || !oy) continue;

      if (axis === 'y') {
        const penDown = (player.y + PLAYER_H) - plat.y;
        const penUp   = (plat.y + plat.h)     - player.y;
        if (penDown <= penUp && step >= 0) {
          // Land on top
          player.y      = plat.y - PLAYER_H;
          player.vy     = 0;
          result.landed = true;

          if (plat.type === 'bounce') {
            player.vy = JUMP_FORCE * 1.3;
            spawnParticles(player.x + PLAYER_W / 2, plat.y, '#fa0', 10, true);
            playBouncePad(); Haptic.bounce();
            if (plat.firstTouch) { plat.firstTouch = false; onPlatformLand('bounce'); }
          } else if (plat.type === 'crumble') {
            if (plat.firstTouch) { plat.firstTouch = false; playCrumble(); onPlatformLand('crumble'); }
            plat.crumbleTimer++;
            if (plat.crumbleTimer > 20) {
              plat.crumbled = true;
              spawnParticles(plat.x + plat.w / 2, plat.y, '#f44', 14, false);
            }
          } else {
            if (plat.firstTouch) { plat.firstTouch = false; onPlatformLand(plat.type); }
            if (_rng() < 0.35) spawnParticles(player.x + PLAYER_W / 2, plat.y + 2, '#aef', 3, false);
          }
        } else if (penUp < penDown && step < 0) {
          // Ceiling hit
          player.y = plat.y + plat.h;
          if (player.vy < 0) player.vy = 0;
          result.hitCeiling = true;
        }
      } else {
        // X-axis: horizontal platform wall
        const penRight = (player.x + PLAYER_W) - plat.x;
        const penLeft  = (plat.x + plat.w)     - player.x;
        if (penRight <= penLeft && step > 0) {
          player.x = plat.x - PLAYER_W; player.vx = 0;
        } else if (penLeft < penRight && step < 0) {
          player.x = plat.x + plat.w;  player.vx = 0;
        }
      }
    }
  }
  return result;
}

/* ================================================================
   14. TOWER WALL COLLISION  (canvas left/right edges)
   ================================================================ */
function resolveWalls() {
  player.onWallLeft  = false;
  player.onWallRight = false;
  if (player.x <= 0)                       { player.x = 0;                      if (player.vx < 0) player.vx = 0; player.onWallLeft  = true; }
  if (player.x + PLAYER_W >= canvas.width) { player.x = canvas.width - PLAYER_W; if (player.vx > 0) player.vx = 0; player.onWallRight = true; }
}

/* ================================================================
   15. WALL SLIDE  (limit fall speed while pressed against wall)
   ================================================================ */
function applyWallSlide() {
  if (player.onGround) return;
  const goLeft  = keys.left  || joyLeft;
  const goRight = keys.right || joyRight;

  const slideLeft  = player.onWallLeft  && (goLeft  || player.vx <= 0);
  const slideRight = player.onWallRight && (goRight || player.vx >= 0);

  if ((slideLeft || slideRight) && player.vy > WALL_SLIDE_MAX_VY) {
    player.vy = WALL_SLIDE_MAX_VY;
    if (frameCount % 8 === 0) {
      const wx = slideLeft ? 2 : canvas.width - 4;
      spawnParticles(wx, player.y + PLAYER_H * 0.6, '#aef', 2);
    }
  }

  if (slideLeft || slideRight) {
    player.wallGrace   = WALL_JUMP_GRACE;
    player.lastWallDir = slideLeft ? -1 : 1;
  } else if (player.wallGrace > 0) {
    player.wallGrace--;
  }
}

/* ================================================================
   16. WALL JUMP  (60° from horizontal, away from wall)
   ================================================================ */
function tryWallJump() {
  const onWall = player.onWallLeft || player.onWallRight || player.wallGrace > 0;
  if (!onWall || player.onGround) return false;

  const wallDir  = player.onWallLeft ? -1
                 : player.onWallRight ? 1
                 : player.lastWallDir;

  player.vx         = -wallDir * WALL_JUMP_VX;
  player.vy         = WALL_JUMP_VY;
  player.wallGrace  = 0;
  player.jumpActive = true;
  player.jumpHeld   = jumpHeld;

  spawnParticles(
    wallDir === -1 ? 2 : canvas.width - 4,
    player.y + PLAYER_H * 0.5,
    '#0ff', 8, true
  );
  playWallJump(); Haptic.wallJump();
  onPlatformLand('wall');
  return true;
}

/* ================================================================
   17. NORMAL JUMP  (coyote + buffer)
   ================================================================ */
function tryNormalJump() {
  if (player.jumpBuffer <= 0)                              return false;
  if (!player.onGround && player.coyoteTime <= 0)         return false;

  player.vy         = JUMP_FORCE;
  player.coyoteTime = 0;
  player.jumpBuffer = 0;
  player.jumpActive = true;
  player.jumpHeld   = jumpHeld;

  spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H, '#7ff', 8, true);
  playJump(); Haptic.jump();
  return true;
}

/* ================================================================
   18. VARIABLE JUMP HEIGHT  (release early = shorter jump)
   ================================================================ */
function applyVariableJump() {
  if (player.jumpActive && player.vy < 0) {
    if (!jumpHeld && player.jumpHeld) {
      player.vy *= JUMP_CUT_FACTOR;
    }
  }
  player.jumpHeld  = jumpHeld;
  if (player.vy >= 0) player.jumpActive = false;
}

/* updateCamera is defined in section 20b, after the physics helpers */

function isDead() {
  return player.y < dangerY + PLAYER_H ||
         player.y - cameraY > canvas.height + 80;
}

/* ================================================================
   20. MAIN UPDATE  (handles playing + dying states)
   ================================================================ */
function update() {
  // --- Dying state: slow-motion then show results ---
  if (state === 'dying') {
    _dyingTimer--;
    if (_dyingTimer <= 0) { showResults(); return; }
    runPhysicsStep(SLOW_FACTOR);
    return;
  }

  if (state !== 'playing') return;
  frameCount++;

  runPhysicsStep(1.0);

  // Combo decay
  if (_comboTimer > 0) { _comboTimer--; if (_comboTimer === 0) { _combo = 0; } }

  // HUD
  score = computeScore();
  scoreEl.textContent = score;
  bestEl.textContent  = save.bestScore;

  // Depth display (reuse bestEl position or add depth to score HUD)
  const depthM = Math.floor(_depth / 10);
  // Show depth milestones
  if (depthM >= _nextMilestone) {
    playMilestone();
    spawnPopup(canvas.width / 2, canvas.height * 0.35, _nextMilestone + 'm!', '#00ffff');
    _nextMilestone += 100;
  }

  // Popups
  updatePopups();
}

function runPhysicsStep(dt) {
  const goLeft  = keys.left  || joyLeft;
  const goRight = keys.right || joyRight;
  const mag     = joy.active ? joyMag : 1;

  if (goLeft)  { player.vx -= RUN_ACCEL * mag * dt; player.dir = -1; }
  if (goRight) { player.vx += RUN_ACCEL * mag * dt; player.dir =  1; }

  const friction = player.onGround ? GROUND_FRICTION : AIR_FRICTION;
  player.vx = Math.max(-MAX_RUN_SPEED, Math.min(MAX_RUN_SPEED, player.vx * Math.pow(friction, dt)));

  player.vy += GRAVITY * dt;
  player.vy  = Math.min(player.vy, MAX_FALL_SPEED);

  applyWallSlide();
  applyVariableJump();

  if (player.onGround)            player.coyoteTime = COYOTE_FRAMES;
  else if (player.coyoteTime > 0) player.coyoteTime = Math.max(0, player.coyoteTime - dt);
  if (player.jumpBuffer > 0)      player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);

  if (player.jumpBuffer > 0) {
    if (!tryWallJump()) tryNormalJump();
  }

  const wasOnGround = player.onGround;
  player.onGround   = false;

  sweepAxis('x', player.vx * dt);
  const cY = sweepAxis('y', player.vy * dt);

  if (cY.landed) {
    player.onGround = true;
    if (!wasOnGround) {
      playSfxLand();
      Haptic.land();
    }
  }

  resolveWalls();
  updateCamera(dt);

  // Depth tracking
  const rawDepth = -(player.y - canvas.height * 0.4);
  if (rawDepth > _depth) _depth = rawDepth;

  // Moving platforms
  updateMovingPlatforms();

  // Generate platforms ahead
  const lowestY = platforms.reduce((m, p) => Math.min(m, p.y), Infinity);
  if (lowestY > cameraY - canvas.height * 2) {
    generatePlatforms(lowestY - 90, cameraY - canvas.height * 3);
  }

  // Cull off-screen platforms
  platforms = platforms.filter(p =>
    p.y < cameraY + canvas.height + 100 &&
    p.y > dangerY - 80
  );

  // Particles
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.15 * dt; p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);

  // Walk animation
  if (Math.abs(player.vx) > 0.3) {
    player.frameTimer++;
    if (player.frameTimer > 6) { player.frame = (player.frame + 1) % 4; player.frameTimer = 0; }
  }

  if (isDead()) triggerDeath();
}

/* ================================================================
   20b. CAMERA  (accepts dt for slow-mo compatibility)
   ================================================================ */
function updateCamera(dt) {
  const target = player.y - canvas.height * 0.38;
  if (target < cameraY) cameraY = target;
  const autoScroll = (SCROLL_SPEED_BASE + frameCount * 0.001) * (dt || 1);
  cameraY -= autoScroll;
  dangerY  = cameraY - 60;
}

/* ================================================================
   21. DEATH  (triggers slow-mo then results)
   ================================================================ */
function triggerDeath() {
  if (state === 'dying') return;
  state = 'dying';
  _dyingTimer = 90;  // ~1.5s at real rate (during slow-mo it's visual only)
  playDeath();
  Haptic.death();
  spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, '#7ff', 18, true);
  spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, '#fff', 10, false);
}

/* ================================================================
   22. START / RESTART  +  INIT
   ================================================================ */
function initGame() {
  // Fresh seed for deterministic-but-varied generation
  _rng  = makePRNG((Date.now() ^ Math.floor(Math.random() * 0xFFFF)) & 0xFFFFFF);

  score = 0; frameCount = 0; cameraY = 0; dangerY = -200;
  _depth = 0; _combo = 0; _comboTimer = 0; _peakCombo = 0;
  _nextMilestone = 100; _lastSafeZone = -1;
  _sessionStart = Date.now();

  platforms = []; particles = []; popups = [];
  joyLeft = joyRight = false; jumpHeld = false;

  platforms.push(buildPlatform(canvas.width / 2 - 70, canvas.height * 0.4, 140, 'normal'));
  generatePlatforms(canvas.height * 0.4 - 90, -canvas.height * 3);

  player = {
    x: canvas.width / 2 - PLAYER_W / 2,
    y: canvas.height * 0.4 - PLAYER_H - 2,
    vx: 0, vy: 0,
    onGround: false, coyoteTime: 0,
    jumpBuffer: 0, jumpHeld: false, jumpActive: false,
    onWallLeft: false, onWallRight: false,
    wallGrace: 0, lastWallDir: 0,
    dir: 1, frame: 0, frameTimer: 0
  };

  // Clear popup DOM
  popupLayer.innerHTML = '';
}

function startGame() {
  getAC();   // unlock audio on user gesture
  initGame();
  state = 'playing';
  hideUI();
  pauseBtn.style.display = 'flex';
  overlay.style.display  = 'none';
}

startBtn.addEventListener('click',    startGame);
startBtn.addEventListener('touchend', e => { e.preventDefault(); startGame(); }, { passive: false });

/* ================================================================
   23. DRAW — BACKGROUND
   ================================================================ */
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#050518');
  grad.addColorStop(1, '#0a1535');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Parallax stars (pseudo-random from index seed)
  ctx.fillStyle = 'rgba(200,220,255,0.6)';
  const starSeed = Math.floor(cameraY / 200);
  for (let i = 0; i < 40; i++) {
    const s  = Math.sin(i * 7.3 + starSeed) * 0.5 + 0.5;
    const sx = (i * 137.5) % canvas.width;
    const sy = ((i * 97.3 + cameraY * 0.05) % canvas.height + canvas.height) % canvas.height;
    ctx.fillRect(sx, sy, s * 2 + 0.5, s * 2 + 0.5);
  }

  // Tower wall dashes
  ctx.strokeStyle = 'rgba(100,180,255,0.12)';
  ctx.lineWidth   = 2;
  ctx.setLineDash([8, 16]);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, canvas.height);
  ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Brick pattern on sides
  ctx.strokeStyle = 'rgba(80,140,200,0.08)';
  ctx.lineWidth   = 1;
  const bH = 30, bW = 20;
  const off = ((-cameraY) % bH + bH) % bH;
  for (let row = -1; row < canvas.height / bH + 2; row++) {
    const y  = row * bH + off;
    const dx = (row % 2) * bW * 0.5;
    for (let col = 0; col < 3; col++) {
      ctx.strokeRect(col * bW + dx - bW, y, bW, bH);
      ctx.strokeRect(canvas.width - col * bW - dx, y, bW, bH);
    }
  }
}

/* ================================================================
   24. DRAW — PLATFORMS
   ================================================================ */
function drawPlatform(p) {
  const sy = p.y - cameraY;
  if (sy > canvas.height + 20 || sy < -30) return;
  ctx.save();

  if (p.type === 'bounce') {
    const g = ctx.createLinearGradient(p.x, sy - p.h, p.x, sy + p.h);
    g.addColorStop(0, '#ffa040'); g.addColorStop(1, '#c05000');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(p.x, sy - p.h / 2, p.w, p.h, 4); ctx.fill();
    ctx.strokeStyle = '#ffcc44'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#ffe'; ctx.font = '10px sans-serif';
    ctx.fillText('^^', p.x + p.w / 2 - 8, sy - p.h / 2 - 2);

  } else if (p.type === 'crumble') {
    const crack = p.crumbleTimer / 20;
    ctx.globalAlpha = 1 - crack * 0.7;
    const g = ctx.createLinearGradient(p.x, sy - p.h, p.x, sy + p.h);
    g.addColorStop(0, '#ff6060'); g.addColorStop(1, '#900');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(p.x, sy - p.h / 2, p.w, p.h, 3); ctx.fill();
    if (crack > 0.3) {
      ctx.strokeStyle = '#f00'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x + p.w * 0.3, sy - p.h / 2); ctx.lineTo(p.x + p.w * 0.5, sy + p.h / 2);
      ctx.moveTo(p.x + p.w * 0.6, sy - p.h / 2); ctx.lineTo(p.x + p.w * 0.45, sy + p.h / 2);
      ctx.stroke();
    }

  } else if (p.type === 'moving') {
    // Cyan-green moving platform with directional arrows
    const g = ctx.createLinearGradient(p.x, sy - p.h, p.x, sy + p.h * 2);
    g.addColorStop(0, '#80ffcc'); g.addColorStop(0.5, '#30b080'); g.addColorStop(1, '#107050');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(p.x, sy - p.h / 2, p.w, p.h, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.beginPath(); ctx.roundRect(p.x + 4, sy - p.h / 2 + 2, p.w - 8, p.h / 2 - 1, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.moveDir > 0 ? '>' : '<', p.x + p.w / 2, sy + p.h / 2 - 1); ctx.textAlign = 'left';

  } else {
    // Normal ice platform
    const g = ctx.createLinearGradient(p.x, sy - p.h, p.x, sy + p.h * 2);
    g.addColorStop(0, '#b8f0ff'); g.addColorStop(0.4, '#60c8f0'); g.addColorStop(1, '#2080c0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(p.x, sy - p.h / 2, p.w, p.h, 5); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.roundRect(p.x + 4, sy - p.h / 2 + 2, p.w - 8, p.h / 2 - 1, 3); ctx.fill();

    ctx.strokeStyle = 'rgba(200,240,255,0.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const icx = p.x + p.w * (0.2 + i * 0.3), icy = sy - p.h / 2 + 1;
      ctx.beginPath();
      ctx.moveTo(icx, icy);     ctx.lineTo(icx, icy - 5);
      ctx.moveTo(icx - 3, icy - 2); ctx.lineTo(icx + 3, icy - 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ================================================================
   25. DRAW — PLAYER
   ================================================================ */
function drawPlayer() {
  const sx = player.x, sy = player.y - cameraY;
  const wallLean = player.onWallLeft ? 0.15 : player.onWallRight ? -0.15 : 0;

  ctx.save();
  ctx.translate(sx + PLAYER_W / 2, sy + PLAYER_H / 2);
  if (player.dir < 0) ctx.scale(-1, 1);
  ctx.rotate(wallLean);

  // Body
  ctx.fillStyle = '#3af';
  ctx.beginPath(); ctx.roundRect(-PLAYER_W/2+2, -PLAYER_H/2+8, PLAYER_W-4, PLAYER_H-10, 4); ctx.fill();

  // Head
  ctx.fillStyle = '#fdd';
  ctx.beginPath(); ctx.ellipse(0, -PLAYER_H/2+4, 10, 11, 0, 0, Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle = '#333'; ctx.fillRect(3, -PLAYER_H/2+1, 3, 3);

  // Hat
  ctx.fillStyle = '#07f';
  ctx.fillRect(-8, -PLAYER_H/2-6,  16, 6);
  ctx.fillRect(-5, -PLAYER_H/2-12, 10, 8);

  // Scarf
  ctx.fillStyle = '#f44'; ctx.fillRect(-PLAYER_W/2+2, -PLAYER_H/2+19, PLAYER_W-4, 5);

  // Legs (animated)
  const legOff = Math.sin(player.frame * Math.PI / 2) * 5;
  ctx.fillStyle = '#08d';
  ctx.fillRect(-8, PLAYER_H/2-10, 7, 10 + legOff);
  ctx.fillRect( 1, PLAYER_H/2-10, 7, 10 - legOff);

  // Skates
  ctx.fillStyle = '#aef';
  ctx.fillRect(-10, PLAYER_H/2-2+legOff, 9, 4);
  ctx.fillRect(  1, PLAYER_H/2-2-legOff, 9, 4);

  ctx.restore();

  // Wall-slide sparks
  if ((player.onWallLeft || player.onWallRight) && !player.onGround && player.vy > 0) {
    ctx.fillStyle = 'rgba(0,220,255,0.7)';
    const wx = player.onWallLeft ? sx : sx + PLAYER_W;
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(
        wx + (player.onWallLeft ? 1 : -4) + Math.random() * 4,
        sy + PLAYER_H * 0.5 + Math.random() * PLAYER_H * 0.4,
        2, 2
      );
    }
  }
}

/* ================================================================
   26. DRAW — FREEZE WALL
   ================================================================ */
function drawFreezeWall() {
  const wallY = dangerY - cameraY;
  const g     = ctx.createLinearGradient(0, wallY - 40, 0, wallY + 20);
  g.addColorStop(0,   'rgba(0,200,255,0)');
  g.addColorStop(0.5, 'rgba(0,180,255,0.35)');
  g.addColorStop(1,   'rgba(0,240,255,0.75)');
  ctx.fillStyle = g;
  ctx.fillRect(0, wallY - 40, canvas.width, 60);

  ctx.fillStyle = 'rgba(0,240,255,0.9)';
  ctx.fillRect(0, wallY + 18, canvas.width, 2);

  ctx.fillStyle = '#7ef';
  for (let i = 0; i < 12; i++) {
    const ix = (i / 11) * canvas.width;
    const ih = 10 + Math.sin(Date.now() * 0.003 + i) * 8 + i * 2;
    ctx.beginPath();
    ctx.moveTo(ix - 6, wallY + 2);
    ctx.lineTo(ix + 6, wallY + 2);
    ctx.lineTo(ix,     wallY + ih);
    ctx.closePath();
    ctx.fill();
  }

  if (Math.floor(Date.now() / 300) % 2 === 0) {
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('! DONMA YAKLASIYOR !', canvas.width / 2, wallY + 38);
    ctx.textAlign = 'left';
  }
}

/* ================================================================
   27. DRAW — PARTICLES
   ================================================================ */
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - cameraY, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ================================================================
   28. DRAW — HUD  (score strip + depth + combo + vignette + hints)
   ================================================================ */
function drawHUD() {
  // Danger proximity cyan vignette
  const psy  = player.y - cameraY;
  const wsY  = dangerY  - cameraY;
  const dist = psy - wsY;
  if (dist < 220) {
    ctx.fillStyle = 'rgba(0,200,255,' + ((1 - dist / 220) * 0.18) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Score + depth strip at top (below safe-area)
  const hudH = 42;
  ctx.fillStyle = 'rgba(0,0,30,0.75)';
  ctx.fillRect(0, 0, canvas.width, hudH);

  ctx.font = 'bold 13px Courier New'; ctx.fillStyle = '#ff7';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 10, 16);

  ctx.fillStyle = '#7ff'; ctx.textAlign = 'center';
  ctx.fillText(Math.floor(_depth / 10) + 'm', canvas.width / 2, 16);

  ctx.fillStyle = '#adf'; ctx.textAlign = 'right';
  ctx.fillText('BEST ' + save.bestScore, canvas.width - 10, 16);

  // Combo display
  if (_combo >= 2) {
    const cols = ['', '', '#ffcc00', '#ff9900', '#ff3300'];
    ctx.font = 'bold 14px Courier New';
    ctx.fillStyle = cols[_combo] || '#ffd700';
    ctx.textAlign = 'center';
    ctx.shadowColor = cols[_combo]; ctx.shadowBlur = 8;
    ctx.fillText('x' + _combo + ' COMBO', canvas.width / 2, 36);
    ctx.shadowBlur = 0;
  }

  ctx.textAlign = 'left';

  // Wall-jump hint
  if ((player.onWallLeft || player.onWallRight || player.wallGrace > 0) && !player.onGround) {
    ctx.fillStyle = 'rgba(0,255,200,0.75)';
    ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('WALL JUMP!', canvas.width / 2, canvas.height * 0.14);
    ctx.textAlign = 'left';
  }

  // Joystick outer ring drawn on canvas (complements the CSS nub)
  if (joy.active && (state === 'playing' || state === 'dying')) {
    const zRect = jZone.getBoundingClientRect();
    const cRect = canvas.getBoundingClientRect();
    const ox    = (zRect.left - cRect.left) + joy.ox;
    const oy    = (zRect.top  - cRect.top)  + joy.oy;
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = 'rgba(120,220,255,0.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(ox, oy, joy.RADIUS, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

/* ================================================================
   29. GAME LOOP  (requestAnimationFrame – GPU-synced 60 fps)
   ================================================================ */
function loop() {
  update();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (state === 'menu') {
    // Draw animated falling platform background behind menu overlay
    drawBackground();
    drawMenuAnim();
  } else {
    drawBackground();
    for (const p of platforms) drawPlatform(p);
    drawParticles();
    if (state === 'playing' || state === 'dying') {
      drawPlayer();
      drawFreezeWall();
      drawHUD();
    }
  }

  requestAnimationFrame(loop);
}

/* ================================================================
   30. BOOT
   ================================================================ */
initMenuAnim();
showMenu();
loop();
</script>
</body>
</html>
