<script>
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y);
    this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();
  };
}
function makeIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), cx = size/2, cy = size/2, R = size/2;
  const bg = g.createRadialGradient(cx, cy*0.7, 0, cx, cy, R);
  bg.addColorStop(0,'#1a2a6e'); bg.addColorStop(1,'#04041a');
  g.fillStyle = bg;
  g.beginPath(); g.roundRect(0,0,size,size,size*0.22); g.fill();
  const S = size*0.38;
  g.save(); g.translate(cx,cy); g.shadowColor='#0cf'; g.shadowBlur=size*0.12;
  for (let arm=0;arm<6;arm++) {
    g.save(); g.rotate(arm*Math.PI/3);
    const ag = g.createLinearGradient(0,0,0,-S);
    ag.addColorStop(0,'#7ef8ff'); ag.addColorStop(1,'#b0f0ff');
    g.strokeStyle=ag; g.lineWidth=size*0.04; g.lineCap='round';
    g.beginPath(); g.moveTo(0,0); g.lineTo(0,-S); g.stroke();
    [0.33,0.60].forEach((f,bi)=>{
      const bL=S*(0.38-bi*0.10), bY=-S*f;
      g.lineWidth=size*0.025; g.strokeStyle='#c0f8ff';
      g.beginPath(); g.moveTo(0,bY); g.lineTo(-bL*.866,bY-bL*.5); g.stroke();
      g.beginPath(); g.moveTo(0,bY); g.lineTo(bL*.866,bY-bL*.5); g.stroke();
    });
    const ds=size*0.052; g.fillStyle='#fff';
    g.beginPath(); g.moveTo(0,-S-ds); g.lineTo(ds*.65,-S); g.lineTo(0,-S+ds); g.lineTo(-ds*.65,-S); g.closePath(); g.fill();
    g.restore();
  }
  g.fillStyle='#c8f8ff'; g.shadowBlur=size*0.06; g.shadowColor='#fff';
  g.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6,r=size*0.075;i===0?g.moveTo(Math.cos(a)*r,Math.sin(a)*r):g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  g.closePath(); g.fill();
  g.fillStyle='#fff'; g.shadowBlur=size*0.10; g.shadowColor='#aff';
  g.beginPath(); g.arc(0,0,size*0.028,0,Math.PI*2); g.fill();
  g.restore();
  return c.toDataURL('image/png');
}
const icon512=makeIcon(512), icon192=makeIcon(192), icon180=makeIcon(180);

(()=>{
  const m={name:'Ice Tower',short_name:'Ice Tower',description:'Infinite ice tower wall-jump platformer',
    display:'standalone',orientation:'portrait',start_url:'.',scope:'.',
    theme_color:'#0a0a2e',background_color:'#04041a',categories:['games'],lang:'tr',
    icons:[{src:icon192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
           {src:icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  document.getElementById('pwa-manifest').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
})();
(()=>{
  if(!('serviceWorker' in navigator)) return;
  const src=`const C='ice-tower-v2',S=self.registration.scope;
self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>fetch(S,{cache:'reload'}).then(r=>{if(r.ok)c.put(S,r)}).catch(()=>{})).then(()=>self.skipWaiting())));
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(cached=>{if(cached){fetch(e.request).then(r=>{if(r&&r.status===200)caches.open(C).then(c=>c.put(e.request,r))}).catch(()=>{});return cached;}return fetch(e.request).then(r=>{if(r&&r.status===200&&r.type!=='opaque'){const cl=r.clone();caches.open(C).then(c=>c.put(e.request,cl));}return r;}).catch(()=>{if(e.request.mode==='navigate')return caches.match(S);});}))}); `;
  const url=URL.createObjectURL(new Blob([src],{type:'application/javascript'}));
  navigator.serviceWorker.register(url,{scope:'./'}).catch(()=>{});
})();
(()=>{

resize(); window.addEventListener('resize',resize);
const Haptic={
  _v:p=>{try{if(save.settings.haptic&&navigator.vibrate)navigator.vibrate(p);}catch(e){}},
  land:()=>Haptic._v(18), jump:()=>Haptic._v(10), death:()=>Haptic._v([50,30,50]),
  wallJump:()=>Haptic._v(15), bounce:()=>Haptic._v([8,10,8])
};
const SAVE_KEY='iceTower_v3';
let save=Object.assign({bestScore:0,bestDepth:0,totalRuns:0,settings:{sound:true,haptic:true}},
  (()=>{try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return s||{};}catch(e){return{};}})());
if(!save.settings) save.settings={sound:true,haptic:true};
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}};
let _ac=null;
const getAC=()=>{if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;};
const _g=(ac,vol,t0,t1)=>{const g=ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.linearRampToValueAtTime(0.0001,t1);g.connect(ac.destination);return g;};
function playJump(){if(!save.settings.sound)return;const ac=getAC(),t=ac.currentTime,o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(430,t+0.10);o.connect(_g(ac,0.16,t,t+0.12));o.start(t);o.stop(t+0.13);}
function playWallJump(){if(!save.settings.sound)return;const ac=getAC(),t=ac.currentTime,o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(500,t+0.09);o.frequency.linearRampToValueAtTime(280,t+0.17);o.connect(_g(ac,0.18,t,t+0.17));o.start(t);o.stop(t+0.18);}
function playLand(){if(!save.settings.sound)return;const ac=getAC(),t=ac.currentTime,o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(55,t+0.06);o.connect(_g(ac,0.18,t,t+0.07));o.start(t);o.stop(t+0.07);}
function playBounce(){if(!save.settings.sound)return;const ac=getAC(),t=ac.currentTime,o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(85,t+0.10);o.frequency.linearRampToValueAtTime(250,t+0.20);o.connect(_g(ac,0.22,t,t+0.22));o.start(t);o.stop(t+0.23);}
function playCrumble(){if(!save.settings.sound)return;const ac=getAC(),t=ac.currentTime;for(let b=0;b<4;b++){const dt=b*0.045,l=Math.ceil(ac.sampleRate*0.03),buf=ac.createBuffer(1,l,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*(1-i/l);const s=ac.createBufferSource();s.buffer=buf;s.connect(_g(ac,0.12-b*0.025,t+dt,t+dt+0.03));s.start(t+dt);}}
function playDeath(){if(!save.settings.sound)return;const ac=getAC(),t=ac.currentTime,o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(40,t+0.80);o.connect(_g(ac,0.28,t,t+0.85));o.start(t);o.stop(t+0.90);}
function playMilestone(){if(!save.settings.sound)return;const ac=getAC(),t=ac.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{const dt=i*0.10,o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,t+dt);o.connect(_g(ac,0.15,t+dt,t+dt+0.28));o.start(t+dt);o.stop(t+dt+0.30);});}
function makePRNG(seed){let s=(seed>>>0)||1;return ()=>{s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),1|s);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296;};}
let rng=Math.random;
const GRAVITY=0.45, JUMP_FORCE=-11.0, JUMP_CUT=0.50, MAX_FALL=18;
const MAX_RUN=6.0, RUN_ACCEL=1.2, GND_FRIC=0.82, AIR_FRIC=0.95;
const WALL_SLIDE_VY=2.0, WJ_VX=4.5, WJ_VY=-7.794;
const WALL_GRACE=6, COYOTE=8, JBUF_MAX=10, SUB_STEP=8;
const PW=28, PH=36, PLAT_H=14;

const joy={active:false,id:null,ox:0,oy:0,dx:0,dy:0,R:60,dead:8};
let jL=false,jR=false,jMag=1;
function joyStart(id,cx,cy){if(joy.active)return;joy.active=true;joy.id=id;joy.ox=cx;joy.oy=cy;joy.dx=joy.dy=0;jL=jR=false;jMag=0;joyBase.style.left=cx+'px';joyBase.style.top=cy+'px';joyNub.style.left=cx+'px';joyNub.style.top=cy+'px';joyBase.style.display=joyNub.style.display='block';}
function joyMove(id,cx,cy){if(!joy.active||joy.id!==id)return;const dx=cx-joy.ox,dy=cy-joy.oy,dist=Math.sqrt(dx*dx+dy*dy);const cl=Math.min(dist,joy.R),a=Math.atan2(dy,dx);joy.dx=Math.cos(a)*cl;joy.dy=Math.sin(a)*cl;joyNub.style.left=(joy.ox+joy.dx)+'px';joyNub.style.top=(joy.oy+joy.dy)+'px';jL=joy.dx<-joy.dead;jR=joy.dx>joy.dead;jMag=Math.min(Math.abs(joy.dx)/joy.R,1);}
function joyEnd(id){if(joy.id!==id)return;joy.active=false;joy.id=null;joy.dx=joy.dy=0;jL=jR=false;jMag=1;joyBase.style.display=joyNub.style.display='none';}
joyZone.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)joyStart(t.identifier,t.clientX,t.clientY);},{passive:false});
joyZone.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)joyMove(t.identifier,t.clientX,t.clientY);},{passive:false});
joyZone.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)joyEnd(t.identifier);},{passive:false});
joyZone.addEventListener('touchcancel',e=>{e.preventDefault();for(const t of e.changedTouches)joyEnd(t.identifier);},{passive:false});
const jTouches=new Map();
let jumpHeld=false;
function doJump(){if(state==='playing'){pl.jumpBuf=JBUF_MAX;jumpHeld=true;}}
function doJumpRelease(){jumpHeld=false;}
jumpZone.addEventListener('touchstart',e=>{e.preventDefault();jumpZone.classList.add('on');for(const t of e.changedTouches)jTouches.set(t.identifier,t.clientY);doJump();},{passive:false});
jumpZone.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const sy=jTouches.get(t.identifier);if(sy!==undefined&&sy-t.clientY>22){doJump();jTouches.set(t.identifier,t.clientY);}}},{passive:false});

const keys={left:false,right:false};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&state==='playing'){if(!jumpHeld)pl.jumpBuf=JBUF_MAX;jumpHeld=true;}
  if(e.key==='Escape'||e.key==='p'){if(state==='playing')doPause();else if(state==='paused')doResume();}
  if(e.key==='Enter'&&(state==='menu'||state==='results'))startGame();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;

function drawParticles(){for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y-cameraY,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function drawHUD(){
  const psy=pl.y-cameraY,wsY=dangerY-cameraY,dist=psy-wsY;if(dist<230){ctx.fillStyle=`rgba(0,200,255,${(1-dist/230)*0.16})`;ctx.fillRect(0,0,canvas.width,canvas.height);}
  if(combo>=2){const cols=['','','#ffcc00','#ff9900','#ff3300'];ctx.font='bold 14px Courier New';ctx.fillStyle=cols[combo]||'#ffd700';ctx.shadowColor=cols[combo];ctx.shadowBlur=10;ctx.textAlign='center';ctx.fillText('x'+combo+' COMBO',canvas.width/2,70);ctx.shadowBlur=0;ctx.textAlign='left';}
  ctx.font='12px Courier New';ctx.fillStyle='rgba(0,200,255,0.7)';ctx.textAlign='center';ctx.fillText(Math.floor(depth/10)+'m',canvas.width/2,85);ctx.textAlign='left';
  if((pl.onWL||pl.onWR||pl.wGrace>0)&&!pl.onGnd){ctx.fillStyle='rgba(0,255,200,0.82)';ctx.font='bold 12px Courier New';ctx.textAlign='center';ctx.shadowColor='#0fc';ctx.shadowBlur=8;ctx.fillText('DUVARDAN ZIPLA!',canvas.width/2,canvas.height*0.13);ctx.shadowBlur=0;ctx.textAlign='left';}
}
function loop(){
  update();ctx.save();if(shakeAmt>0.2){ctx.translate(shakeX,shakeY);}ctx.clearRect(-10,-10,canvas.width+20,canvas.height+20);
  drawBg();if(state==='menu'){drawMenuAnim();}else{for(const p of platforms)drawPlat(p);drawParticles();if(state==='playing'||state==='dying'){drawPlayer();drawFreezeWall();drawHUD();}}
  ctx.restore();requestAnimationFrame(loop);
}
initMenuPlats();showMenu();loop();
</script>
